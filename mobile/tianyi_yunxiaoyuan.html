<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>天一云校园</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        html {
            background-color: #f1f5f9;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 10% 10%, rgba(224, 231, 255, 0.4) 0%, rgba(255, 241, 242, 0.3) 40%, rgba(255, 255, 255, 1) 100%);
            background-color: #ffffff;
            box-shadow: 0 0 40px rgba(15, 23, 42, 0.08);
            border-left: 1px solid rgba(226, 232, 240, 0.6);
            border-right: 1px solid rgba(226, 232, 240, 0.6);
        }

        .wx-capsule {
            border: 1px solid rgba(226, 232, 240, 0.8);
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }

        .banner-gradient {
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.25);
        }

        .ai-clip-badge {
            clip-path: polygon(0 0, 100% 0, 75% 100%, 0% 100%);
            background: linear-gradient(90deg, #4ade80 0%, #22c55e 100%);
        }

        /* Brush portal gradient */
        .brush-card-bg {
            background: linear-gradient(135deg, #fffcf6 0%, #fef3c7 100%);
            box-shadow: 0 8px 18px -4px rgba(249, 115, 22, 0.15);
        }

        /* Vocabulary card gradient */
        .vocab-card-bg {
            background: linear-gradient(135deg, #f4fbf7 0%, #e0f2fe 100%);
            box-shadow: 0 8px 18px -4px rgba(56, 189, 248, 0.15);
        }

        /* English Reading card gradient */
        .read-card-bg {
            background: linear-gradient(135deg, #faf5ff 0%, #e0f2fe 100%);
            box-shadow: 0 8px 18px -4px rgba(147, 51, 234, 0.15);
        }

        /* App icon shadows */
        .app-icon-shadow {
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.05));
        }

        /* Floating effect */
        @keyframes float-slow {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(3deg); }
        }
        .animate-float {
            animation: float-slow 4s ease-in-out infinite;
        }

        /* Active transitions */
        .press-effect {
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .press-effect:active {
            transform: scale(0.97);
            filter: brightness(0.95);
        }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col justify-between pb-24 relative select-none">

    <!-- Top Navigation Bar / App Title Header -->
    <div class="px-5 pt-5 pb-2 flex items-center justify-between">
        <!-- Logo and Brand -->
        <div class="flex items-center gap-2">
            <!-- Custom SVG Book Wings mascot for Tianyi -->
            <div class="relative w-8 h-8 flex items-center justify-center">
                <svg viewBox="0 0 100 100" fill="none" class="w-8 h-8 app-icon-shadow" xmlns="http://www.w3.org/2000/svg">
                    <!-- Graduation Cap/Book Accent with red and dark blue -->
                    <path d="M12 40L50 20L88 40L50 60L12 40Z" fill="#1e3a8a" />
                    <path d="M22 45V65C22 75 50 82 50 82C50 82 78 75 78 65V45L50 60L22 45Z" fill="#1e40af" />
                    <!-- Red ribbon details -->
                    <path d="M50 42L72 53" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
                    <circle cx="50" cy="20" r="4" fill="#ef4444" />
                </svg>
            </div>
            <span class="text-2xl font-extrabold text-[#111c3c] tracking-tight">天一云校园</span>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="px-4 space-y-5 flex-1">
        
        <!-- Exam/Category Header Row -->
        <div class="flex items-center justify-between px-1">
            <div class="flex items-center gap-1.5 bg-slate-100/70 hover:bg-slate-200/50 px-3 py-1.5 rounded-full cursor-pointer transition-colors">
                <span class="text-[17px] font-bold text-gray-800">专升本</span>
                <i class="fas fa-caret-down text-gray-500 text-xs"></i>
            </div>
            <!-- Distance Counter -->
            <div class="text-sm font-medium text-gray-500">
                距离考试还有 <span class="text-rose-500 font-bold text-base px-0.5">-</span> 天
            </div>
        </div>

        <!-- AI Hero Image Banner -->
        <div class="banner-gradient rounded-[24px] p-6 text-white relative overflow-hidden press-effect cursor-pointer" onclick="window.location.href='tianyi_yunxiaoyuan_shuati.html'">
            <!-- Highlight Accent glow -->
            <div class="absolute -top-12 -left-12 w-48 h-48 bg-sky-300 rounded-full mix-blend-screen filter blur-3xl opacity-30"></div>
            <div class="absolute -bottom-12 -right-12 w-48 h-48 bg-blue-300 rounded-full mix-blend-screen filter blur-3xl opacity-30"></div>

            <!-- "AI" Diagonal Badge Tag -->
            <div class="absolute top-0 left-0 ai-clip-badge px-5 py-1.5 text-[11px] font-extrabold tracking-wider text-white shadow-sm flex items-center gap-1">
                AI
            </div>

            <!-- Left content -->
            <div class="w-3/5 space-y-1.5 relative z-10 pt-2">
                <h2 class="text-[26px] font-extrabold tracking-wide leading-tight text-white drop-shadow-sm">一拍搞定</h2>
                <p class="text-sky-100 text-sm font-medium tracking-wide">3秒快速出结果</p>
            </div>

            <!-- Right content (Visual vector camera illustration) -->
            <div class="absolute right-4 bottom-2 top-2 w-2/5 flex items-center justify-center">
                <div class="relative w-24 h-24 flex items-center justify-center animate-float">
                    <!-- Smartphone frame representation -->
                    <div class="absolute w-16 h-20 bg-sky-200/20 backdrop-blur-[2px] border border-white/40 rounded-xl shadow-lg transform rotate-[-6deg] flex items-center justify-center">
                        <!-- Camera aperture glow -->
                        <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center border border-white/60">
                            <!-- Inner lens -->
                            <div class="w-7 h-7 rounded-full bg-white flex items-center justify-center text-blue-600 shadow-md">
                                <i class="fas fa-search text-xs"></i>
                            </div>
                        </div>
                    </div>
                    <!-- Absolute sparkle icons -->
                    <div class="absolute top-2 right-1 text-teal-300 text-lg"><i class="fas fa-sparkles text-amber-200"></i>✦</div>
                    <div class="absolute bottom-1.5 left-2 text-cyan-200 text-sm">✦</div>
                </div>
            </div>
        </div>

        <!-- Portals Bento Grid: AI 刷题 & AI 背单词 -->
        <div>
            <h3 class="text-lg font-bold text-[#111c3c] mb-3 px-1 flex items-center justify-between">
                <span>日积月累 稳步提高</span>
            </h3>
            
            <div class="grid grid-cols-2 gap-3.5">
                <!-- AI刷题 Card -->
                <a href="tianyi_yunxiaoyuan_shuati.html" class="brush-card-bg rounded-[24px] p-5 relative overflow-hidden press-effect flex flex-col justify-between h-[165px] block">
                    <!-- Top Float decoration (Orange marker sketch overlay) -->
                    <div class="absolute top-0 right-0 transform translate-x-3 -translate-y-3 scale-95">
                        <div class="w-18 h-18 relative flex items-center justify-center">
                            <!-- Orange Badge Circle background in screenshot -->
                            <div class="absolute w-12 h-12 bg-gradient-to-br from-orange-400 to-amber-500 rounded-full transform rotate-12 flex items-center justify-center shadow-md shadow-orange-300/30">
                                <i class="fas fa-pencil text-white text-base"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Texts -->
                    <div class="space-y-1.5 z-10">
                        <span class="inline-block bg-orange-100 text-orange-700 text-[10px] font-extrabold px-2 py-0.5 rounded-full select-none">AI定制真题</span>
                        <h4 class="text-lg font-extrabold text-[#1a2e40] tracking-tight mt-1">AI刷题</h4>
                        <p class="text-xs text-orange-850/80 font-medium leading-relaxed">已完成 - / - 题</p>
                    </div>

                    <!-- Button Pill -->
                    <div class="z-10">
                        <span class="inline-flex items-center gap-1 bg-white text-orange-600 px-3 py-1.5 rounded-full text-[11px] font-extrabold shadow-sm hover:shadow transition-all">
                            GO <i class="fas fa-arrow-right-long text-[9px]"></i>
                        </span>
                    </div>
                </a>

                <!-- AI背单词 Card -->
                <a href="#" class="vocab-card-bg rounded-[24px] p-5 relative overflow-hidden press-effect flex flex-col justify-between h-[165px] block">
                    <!-- Top Float decoration (Blue Tag En) -->
                    <div class="absolute top-0 right-0 transform translate-x-3 -translate-y-3 scale-95">
                        <div class="w-18 h-18 relative flex items-center justify-center">
                            <div class="absolute w-12 h-12 bg-gradient-to-br from-blue-400 to-sky-500 rounded-full transform -rotate-12 flex items-center justify-center shadow-md shadow-blue-300/30">
                                <span class="text-white font-extrabold text-[12px]">En</span>
                            </div>
                        </div>
                    </div>

                    <!-- Texts -->
                    <div class="space-y-1.5 z-10">
                        <span class="inline-block bg-blue-100 text-blue-700 text-[10px] font-extrabold px-2 py-0.5 rounded-full select-none">词汇特训</span>
                        <h4 class="text-lg font-extrabold text-[#1a2e40] tracking-tight mt-1">AI背单词</h4>
                        <p class="text-xs text-blue-900/85 font-medium leading-relaxed">已做 0/2450 词</p>
                    </div>

                    <!-- Button Pill Link -->
                    <div class="z-10">
                        <span class="inline-flex items-center gap-1.5 text-blue-600 bg-white px-3 py-1.5 rounded-full text-[11px] font-extrabold shadow-sm hover:shadow transition-all">
                            词汇 GO <i class="fas fa-arrow-right-long text-[9px]"></i>
                        </span>
                    </div>
                </a>
            </div>
        </div>

        <!-- Learning Tools (学习工具) Grid Section -->
        <div class="bg-white/80 backdrop-blur-sm rounded-[24px] p-5 border border-slate-100 shadow-sm">
            <h3 class="text-lg font-bold text-[#111c3c] mb-5">学习工具</h3>
            
            <div class="grid grid-cols-4 gap-y-6 gap-x-2 text-center">
                <!-- Tool 1: 课表 -->
                <div class="group flex flex-col items-center cursor-pointer press-effect">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-orange-400 to-amber-500 flex items-center justify-center text-white shadow-md shadow-orange-100 group-hover:scale-105 transition-transform">
                        <i class="far fa-calendar-alt text-xl"></i>
                    </div>
                    <span class="text-sm font-semibold text-gray-700 mt-2.5">课表</span>
                </div>

                <!-- Tool 2: 班级 -->
                <div class="group flex flex-col items-center cursor-pointer press-effect">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-rose-400 to-red-500 flex items-center justify-center text-white shadow-md shadow-rose-100 group-hover:scale-105 transition-transform">
                        <i class="fas fa-id-card-clip text-xl"></i>
                    </div>
                    <span class="text-sm font-semibold text-gray-700 mt-2.5">班级</span>
                </div>

                <!-- Tool 3: 听课证 -->
                <div class="group flex flex-col items-center cursor-pointer press-effect">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-400 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-blue-100 group-hover:scale-105 transition-transform">
                        <i class="far fa-id-badge text-xl"></i>
                    </div>
                    <span class="text-sm font-semibold text-gray-700 mt-2.5">听课证</span>
                </div>

                <!-- Tool 4: 考勤 -->
                <div class="group flex flex-col items-center cursor-pointer press-effect">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-400 to-green-500 flex items-center justify-center text-white shadow-md shadow-emerald-100 group-hover:scale-105 transition-transform">
                        <i class="fas fa-house-laptop text-lg"></i>
                    </div>
                    <span class="text-sm font-semibold text-gray-700 mt-2.5">考勤</span>
                </div>

                <!-- Tool 5: 作业 -->
                <div class="group flex flex-col items-center cursor-pointer press-effect">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-sky-400 to-blue-400 flex items-center justify-center text-white shadow-md shadow-sky-100 group-hover:scale-105 transition-transform">
                        <i class="far fa-file-lines text-xl"></i>
                    </div>
                    <span class="text-sm font-semibold text-gray-700 mt-2.5">作业</span>
                </div>

                <!-- Tool 6: 课评 -->
                <div class="group flex flex-col items-center cursor-pointer press-effect">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-amber-500 to-orange-400 flex items-center justify-center text-white shadow-md shadow-amber-100 group-hover:scale-105 transition-transform">
                        <i class="fas fa-video text-lg"></i>
                    </div>
                    <span class="text-sm font-semibold text-gray-700 mt-2.5">课评</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/95 backdrop-blur-md border-t border-slate-100 py-2.5 px-4 flex justify-around items-center z-50 shadow-2xl rounded-t-[20px]">
        
        <!-- Tab 1: 首页 -->
        <a href="../index.html" class="flex flex-col items-center text-blue-600 transition-colors">
            <div class="w-6 h-6 flex items-center justify-center">
                <i class="fas fa-house text-lg"></i>
            </div>
            <span class="text-[11px] font-bold mt-1">首页</span>
        </a>

        <!-- Tab 2: AI备考 -->
        <a href="tianyi_yunxiaoyuan.html" class="flex flex-col items-center text-gray-400 hover:text-blue-600 transition-colors">
            <div class="w-6 h-6 flex items-center justify-center relative">
                <i class="far fa-folder-open text-lg"></i>
            </div>
            <span class="text-[11px] font-bold mt-1">AI备考</span>
        </a>

        <!-- Tab 3: 积分 -->
        <a href="#" class="flex flex-col items-center text-gray-400 hover:text-blue-600 transition-colors">
            <div class="w-6 h-6 flex items-center justify-center">
                <i class="fas fa-coins text-lg"></i>
            </div>
            <span class="text-[11px] font-bold mt-1">积分</span>
        </a>

        <!-- Tab 4: 我的 -->
        <a href="#" class="flex flex-col items-center text-gray-400 hover:text-blue-600 transition-colors">
            <div class="w-6 h-6 flex items-center justify-center">
                <i class="far fa-smile text-lg"></i>
            </div>
            <span class="text-[11px] font-bold mt-1">我的</span>
        </a>
    </div>

</body>
</html>
