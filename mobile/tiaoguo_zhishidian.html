<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>已跳过知识点</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // 清理 URL 中的 origin 参数，保持地址栏整洁
        (function() {
            const url = new URL(window.location.href);
            if (url.searchParams.has('origin')) {
                url.searchParams.delete('origin');
                const newUrl = url.pathname + url.search + url.hash;
                window.history.replaceState({}, '', newUrl);
            }
        })();
    </script>
    <style>
        /* 重置样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            color: #333;
            background-color: #f8f9fc;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        /* 顶部导航栏 */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 56px;
            padding: 0 16px;
            background-color: #fff;
            border-bottom: 1px solid #f1f5f9;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            font-size: 18px;
            color: #475569;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 101;
        }

        .back-btn:active {
            opacity: 0.7;
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
            color: #1e293b;
        }

        /* 列表区域 */
        .points-list {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        /* 知识点卡片，样式与北航知识点列表中样式及智能规划相同 */
        .point-card {
            background-color: #fff;
            border-radius: 10px;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02), 0 1px 3px rgba(0, 0, 0, 0.01);
            border: 1px solid #e2e8f0;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .point-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .point-title-container {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            flex: 1;
        }

        /* 序号标记 */
        .serial-num {
            font-family: "JetBrains Mono", monospace;
            font-size: 15px;
            font-weight: 700;
            color: #94a3b8;
            background-color: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
            text-align: center;
        }

        .point-title {
            font-size: 15px;
            font-weight: 600;
            color: #1e293b;
            line-height: 1.4;
        }

        .item-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        /* 原北航系统tag样式 */
        .beihang-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: normal;
            display: inline-block;
            vertical-align: middle;
            border: 1px solid transparent;
        }

        .beihang-tag.val-tag {
            color: #d46b08;
            background-color: #fff7e6;
            border-color: #ffd591;
        }

        .beihang-tag.tag-hard {
            color: #cf1322;
            background-color: #fff1f0;
            border-color: #ffa39e;
        }

        .beihang-tag.tag-medium {
            color: #d46b08;
            background-color: #fff7e6;
            border-color: #ffd591;
        }

        .beihang-tag.tag-easy {
            color: #389e0d;
            background-color: #f6ffed;
            border-color: #b7eb8f;
        }

        .beihang-tag.freq-tag {
            color: #096dd9;
            background-color: #e6f7ff;
            border-color: #91d5ff;
        }

        .beihang-tag.type-tag {
            color: #722ed1;
            background-color: #f9f0ff;
            border-color: #d3adf7;
        }

        /* 正确率进度信息 */
        .point-meta-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: #64748b;
        }

        .accuracy-green {
            color: #10b981;
            font-weight: 600;
        }

        /* 按钮样式 */
        .btn {
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            height: 30px;
        }

        .btn-success {
            background-color: #1890ff;
            color: #fff;
            border: 1px solid #1890ff;
            padding: 0 14px;
        }

        .btn-success:active {
            background-color: #096dd9;
            border-color: #096dd9;
        }

        /* 空列表状态 */
        .empty-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
            color: #94a3b8;
            flex: 1;
        }

        .empty-icon {
            font-size: 40px;
            margin-bottom: 12px;
            color: #cbd5e1;
        }

        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background-color: rgba(30, 41, 59, 0.9);
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="header">
        <button class="back-btn" onclick="window.location.href='zhineng_guihua.html'"><i class="fas fa-chevron-left"></i></button>
        <span class="header-title">已跳过知识点</span>
    </div>

    <!-- 列表区域 -->
    <div class="points-list" id="skippedListContainer">
        <!-- 动态生成 -->
    </div>

    <!-- 弹窗消息 -->
    <div class="toast-msg" id="toastMsg"></div>

    <script>
        const defaultKnowledgePoints = [
            {id: 1, title: "微积分与级数基础", difficulty: "难", freq: "5/5年", types: ["单选题", "多选题"], stars: 5, skipped: false, progress: "28/45", rate: "62.2%"},
            {id: 2, title: "数据结构与算法", difficulty: "中", freq: "4/5年", types: ["单选题", "多选题"], stars: 5, skipped: false, progress: "15/30", rate: "75%"},
            {id: 3, title: "学术论文阅读理解", difficulty: "中", freq: "4/5年", types: ["单选题", "问答题"], stars: 4, skipped: false, progress: "18/25", rate: "80%"},
            {id: 4, title: "矩阵与二次型", difficulty: "易", freq: "3/5年", types: ["单选题", "多选题"], stars: 3, skipped: false, progress: "10/10", rate: "100%"},
            {id: 5, title: "图论与数理逻辑", difficulty: "难", freq: "2/5年", types: ["单选题", "问答题"], stars: 4, skipped: false, progress: "5/15", rate: "50%"},
            {id: 6, title: "线性代数与向量空间", difficulty: "中", freq: "3/5年", types: ["单选题", "填空题"], stars: 3, skipped: false, progress: "0/20", rate: "0%"},
            {id: 7, title: "操作系统与底层编译", difficulty: "难", freq: "4/5年", types: ["单选题", "问答题"], stars: 5, skipped: false, progress: "2/12", rate: "41.6%"},
            {id: 8, title: "逻辑句法与真值表", difficulty: "易", freq: "2/5年", types: ["单选题", "多选题"], stars: 2, skipped: false, progress: "7/10", rate: "90%"},
            {id: 9, title: "人工智能与神经网络", difficulty: "中", freq: "5/5年", types: ["单选题", "问答题"], stars: 4, skipped: false, progress: "0/15", rate: "0%"},
            {id: 10, title: "概率论与数理统计", difficulty: "中", freq: "4/5年", types: ["单选题", "填空题"], stars: 4, skipped: false, progress: "12/20", rate: "85%"}
        ];

        function getPoints() {
            let pts = localStorage.getItem('beihang_points');
            if (!pts) {
                localStorage.setItem('beihang_points', JSON.stringify(defaultKnowledgePoints));
                pts = JSON.stringify(defaultKnowledgePoints);
            }
            return JSON.parse(pts);
        }

        function savePoints(pts) {
            localStorage.setItem('beihang_points', JSON.stringify(pts));
        }

        // 显示Toast
        function showToast(text, iconClass = "fa-check-circle") {
            const toast = document.getElementById('toastMsg');
            toast.innerHTML = `<i class="fas ${iconClass}"></i> ${text}`;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 恢复某项
        function restoreItem(id) {
            let pts = getPoints();
            let item = pts.find(p => p.id === id);
            if (item) {
                item.skipped = false;
                savePoints(pts);
                renderList();
                showToast(`已恢复《${item.title}》`, "fa-redo");
            }
        }

        function renderList() {
            const container = document.getElementById('skippedListContainer');
            const data = getPoints();

            // 过滤出被跳过的点
            const skippedList = data.filter(p => p.skipped);

            if (skippedList.length === 0) {
                container.innerHTML = `
                    <div class="empty-container">
                        <i class="fas fa-eye empty-icon"></i>
                        <p style="font-size: 15px; font-weight: 500; margin-bottom: 6px;">没有已跳过的知识点</p>
                        <p style="font-size: 12px; color: #94a3b8;">在“智能规划”列表中可按需跳过部分课程</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            
            skippedList.forEach((point, index) => {
                // 计算序号 格式为 "01", "02"
                const displayIndex = String(index + 1).padStart(2, '0');

                // 难度对应标签
                let diffTagClass = 'tag-medium';
                if (point.difficulty === '难') {
                    diffTagClass = 'tag-hard';
                } else if (point.difficulty === '易') {
                    diffTagClass = 'tag-easy';
                }

                // 颗星
                let starsHTML = '';
                for (let s = 0; s < 5; s++) {
                    if (s < point.stars) {
                        starsHTML += '<i class="fas fa-star" style="color: #ffca28; font-size: 10px;"></i>';
                    } else {
                        starsHTML += '<i class="far fa-star" style="color: #d9d9d9; font-size: 10px;"></i>';
                    }
                }

                // 常考题型拼接
                const typeText = "常考：" + point.types.join('、');

                const cardDiv = document.createElement('div');
                cardDiv.className = 'point-card';
                cardDiv.innerHTML = `
                    <div class="point-header">
                        <div class="point-title-container">
                            <span class="serial-num">${displayIndex}</span>
                            <span class="point-title">${point.title}</span>
                        </div>
                        <div class="item-actions">
                            <button class="btn btn-success" onclick="restoreItem(${point.id})">恢复</button>
                        </div>
                    </div>
                    <div style="padding-left: 32px; display: flex; flex-direction: column; gap: 6px;">
                        <div class="point-meta-row">
                            <span>进度: <strong style="color: #475569; font-weight: 500;">${point.progress}</strong></span>
                            <span>正确率: <span class="accuracy-green">${point.rate}</span></span>
                        </div>
                        <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center;">
                            <span class="beihang-tag val-tag" style="margin-left: 0;">价值: ${starsHTML}</span>
                            <span class="beihang-tag ${diffTagClass}" style="margin-left: 0;">难度: ${point.difficulty}</span>
                            <span class="beihang-tag freq-tag" style="margin-left: 0;">考频: ${point.freq}</span>
                            <span class="beihang-tag type-tag" style="margin-left: 0;">${typeText}</span>
                        </div>
                    </div>
                `;
                container.appendChild(cardDiv);
            });
        }

        // 第一次载入
        window.onload = function() {
            renderList();
        };
    </script>
</body>
</html>
