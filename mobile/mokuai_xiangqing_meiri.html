<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>每日一练</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            color: #333;
            background-color: #f8f9fa;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            height: 48px;
            background-color: #ffffff;
            border-bottom: 1px solid #f0f0f0;
        }

        .back-btn {
            position: absolute;
            left: 16px;
            font-size: 20px;
            color: #333;
            cursor: pointer;
        }

        .header-title {
            font-size: 18px;
            font-weight: 500;
            color: #333;
        }

        .content-container {
            padding: 16px;
        }

        .settings-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        .practice-mode-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
        }

        .practice-card {
            background-color: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }

        .card-stat {
            font-size: 14px;
            color: #888;
            margin-bottom: 8px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #f9f9f9;
        }

        .progress-info {
            font-size: 14px;
            color: #888;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            padding: 8px 16px;
            background-color: #ff4d4f;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(255, 77, 79, 0.15);
            min-width: 88px;
            text-align: center;
        }

        .action-btn.outline {
            background-color: #fff;
            color: #666;
            border: 1px solid #d9d9d9;
            box-shadow: none;
        }

        .action-btn.secondary {
            background-color: #ff4d4f;
        }
    </style>
</head>
<body>
    <div class="header">
        <i class="fas fa-chevron-left back-btn" onclick="history.back()"></i>
        <div class="header-title">每日一练</div>
    </div>

    <div class="content-container">
        <div class="settings-bar">
            <div class="practice-mode-btn">
                <i class="fas fa-cog"></i> 练习模式
            </div>
        </div>

        <!-- 每日一练列表 -->
        <div class="practice-card">
            <div class="card-title">【20260519】每日一练</div>
            <div class="card-stat">正确率：-</div>
            <div class="card-footer">
                <div class="progress-info">进度：-/-</div>
                <button class="action-btn" onclick="location.href='dati_yemian.html'">开始答题</button>
            </div>
        </div>

        <div class="practice-card">
            <div class="card-title">【20260515】每日一练</div>
            <div class="card-stat">正确率：-</div>
            <div class="card-footer">
                <div class="progress-info">进度：0/10</div>
                <button class="action-btn secondary" onclick="location.href='dati_yemian.html'">继续答题</button>
            </div>
        </div>

        <div class="practice-card">
            <div class="card-title">【20260514】每日一练</div>
            <div class="card-stat">正确率：82.5%</div>
            <div class="card-footer">
                <div class="progress-info">进度：10/10</div>
                <div class="btn-group">
                    <button class="action-btn outline" onclick="location.href='shiti_jiexi.html'">查看解析</button>
                    <button class="action-btn" onclick="location.href='dati_yemian.html'">再次答题</button>
                </div>
            </div>
        </div>

        <div class="practice-card">
            <div class="card-title">【20260513】每日一练</div>
            <div class="card-stat">正确率：0%</div>
            <div class="card-footer">
                <div class="progress-info">进度：3/10</div>
                <button class="action-btn secondary" onclick="location.href='dati_yemian.html'">继续答题</button>
            </div>
        </div>

        <div class="practice-card">
            <div class="card-title">【20260512】每日一练</div>
            <div class="card-stat">正确率：-</div>
            <div class="card-footer">
                <div class="progress-info">进度：-</div>
                <button class="action-btn" onclick="location.href='dati_yemian.html'">开始答题</button>
            </div>
        </div>
    </div>
</body>
</html>
