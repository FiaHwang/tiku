<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 清理 URL 中的 origin 参数，保证干净
        (function() {
            const url = new URL(window.location.href);
            if (url.searchParams.has('origin')) {
                url.searchParams.delete('origin');
                const newUrl = url.pathname + url.search + url.hash;
                window.history.replaceState({}, '', newUrl);
            }
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #fafafa;
            color: #333;
        }

        /* 隐藏滚动条 */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        /* 路线图连接线背景 */
        .roadmap-container {
            position: relative;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.03);
            min-height: 480px;
            padding-bottom: 24px;
        }

        /* SVG 连接线 */
        .roadmap-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* 关卡节点基础样式 */
        .node-wrapper {
            position: relative;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 150px;
            margin-bottom: 12px;
        }

        .node-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            padding: 0 12px;
            box-shadow: 0 6px 16px rgba(24, 144, 255, 0.25);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .node-circle:active {
            transform: scale(0.95);
        }

        .node-circle.active {
            background: #1890ff;
        }

        .node-circle.locked {
            background: #b5b5b5;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
            cursor: pointer;
        }

        .node-circle.locked:active {
            transform: scale(0.95);
        }

        /* 规则说明及下拉弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .modal.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 弹出提示框 */
        .toast {
            display: none;
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0,0,0,0.8);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 2000;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .toast.show {
            display: block;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translate(-50%, 20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
    </style>
</head>

    <script>
        // 显示规则框
        function showRules() {
            document.getElementById('rules-modal').classList.add('show');
        }

        // 关闭规则框
        function closeRules() {
            document.getElementById('rules-modal').classList.remove('show');
        }

        // 显示Toast提示
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // 锁定提醒
        function lockNotice(nodeName) {
            showToast('请先通关上一个考点，以解锁' + nodeName + '关卡！');
        }

        // 下拉弹层模拟
        function showDropdown(type) {
            if (type === 'degree') {
                showToast('已选中“专升本”层次，考纲已就绪');
            } else if (type === 'province') {
                showToast('已匹配“河南省 | 专升本英语”大纲');
            }
        }

        // 版本切换
        function toggleVersion() {
            showToast('已成功切换为“英语（版本一）”');
        }

        // 动态使用 SVG 接线连接每个圆圈
        function drawRouteLines() {
            const svg = document.getElementById('connections-svg');
            // 清理已画的路线
            svg.innerHTML = '';

            const nodes = [
                document.getElementById('node-1'),
                document.getElementById('node-2'),
                document.getElementById('node-3'),
                document.getElementById('node-4'),
                document.getElementById('node-5'),
                document.getElementById('node-6')
            ];

            const containerRect = document.querySelector('.roadmap-container').getBoundingClientRect();

            let pathD = '';

            for (let i = 0; i < nodes.length - 1; i++) {
                const nodeCurrent = nodes[i];
                const nodeNext = nodes[i + 1];

                if (!nodeCurrent || !nodeNext) continue;

                const rectCurrent = nodeCurrent.getBoundingClientRect();
                const rectNext = nodeNext.getBoundingClientRect();

                // 圆圈中心点坐标(相对于 .roadmap-container)
                const x1 = rectCurrent.left + rectCurrent.width / 2 - containerRect.left;
                const y1 = rectCurrent.top + rectCurrent.height / 2 - containerRect.top;

                const x2 = rectNext.left + rectNext.width / 2 - containerRect.left;
                const y2 = rectNext.top + rectNext.height / 2 - containerRect.top;

                // 创建贝塞尔或折线曲线
                if (i === 0) {
                    pathD += `M ${x1} ${y1} `;
                }

                // 添加控制点，创造平滑的 S 曲线
                const cpX1 = x1;
                const cpY1 = y1 + (y2 - y1) * 0.5;
                const cpX2 = x2;
                const cpY2 = y1 + (y2 - y1) * 0.5;

                pathD += `C ${cpX1} ${cpY1}, ${cpX2} ${cpY2}, ${x2} ${y2} `;
            }

            // 创建路径
            if (pathD !== '') {
                const pathElement = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                pathElement.setAttribute('d', pathD);
                pathElement.setAttribute('fill', 'none');
                pathElement.setAttribute('stroke', '#dcdcdc');
                pathElement.setAttribute('stroke-width', '2.5');
                pathElement.setAttribute('stroke-dasharray', '6,6');
                svg.appendChild(pathElement);
            }
        }

        // 页面初始化及重排时重新绘图线
        window.addEventListener('load', () => {
            setTimeout(drawRouteLines, 100);
        });
        window.addEventListener('resize', drawRouteLines);
    </script>
