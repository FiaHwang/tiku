<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>刷题版本名称/教材名称</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        (function() {
            const url = new URL(window.location.href);
            if (url.searchParams.has('origin')) {
                url.searchParams.delete('origin');
                const newUrl = url.pathname + url.search + url.hash;
                window.history.replaceState({}, '', newUrl);
            }
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            color: #333;
            background-color: #f8f9fa;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        .header {
            display: flex;
            flex-direction: column;
            padding: 12px 16px;
            background-color: #fff;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #f0f0f0;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .province-selector {
            font-size: 12px;
            color: #888;
            background-color: #f2f2f2;
            padding: 4px 10px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .subject-nav {
            display: flex;
            overflow-x: auto;
            gap: 24px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 4px 0;
        }

        .subject-nav::-webkit-scrollbar {
            display: none;
        }

        .subject-item {
            font-size: 15px;
            color: #666;
            white-space: nowrap;
            position: relative;
            padding-bottom: 8px;
        }

        .subject-item.active {
            color: #ff4d4f;
            font-weight: 600;
        }

        .subject-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 3px;
            background-color: #ff4d4f;
            border-radius: 2px;
        }

        .content-container {
            padding: 12px;
        }

        .special-practice {
            background-color: #fff;
            margin-bottom: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        .action-btn-small {
            padding: 4px 12px;
            border: 1px solid #e8e8e8;
            border-radius: 11px;
            background-color: #fff;
            font-size: 12px;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
            height: 22px;
            line-height: 20px;
            white-space: nowrap;
        }

        .action-btn-small.primary {
            background-color: #ff4d4f;
            color: #fff;
            border-color: #ff4d4f;
        }

        /* 固答刷题模块 */
        .textbook-bar {
            padding: 12px 16px;
            border-bottom: 1px solid #f8f8f8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #fff;
            gap: 8px;
        }

        .practice-mode-tag {
            font-size: 11px;
            color: #999;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background-color: #f5f5f5;
            padding: 0 8px;
            border-radius: 10px;
            border: 1px solid #eee;
            height: 22px;
        }

        .practice-unit {
            padding: 16px;
            border-bottom: 1px solid #f9f9f9;
        }

        .unit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .unit-title {
            font-size: 16px;
            font-weight: 600;
            color: #222;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .unit-progress {
            font-size: 12px;
            color: #bbb;
            margin-top: 4px;
            margin-left: 24px;
        }

        .unit-content {
            margin-top: 14px;
            padding-left: 24px;
        }

        .practice-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px dotted #eeeeee;
        }

        .practice-item:last-child {
            border-bottom: none;
        }

        .item-info {
            flex: 1;
            padding-right: 12px;
        }

        .item-title {
            font-size: 14px;
            color: #333;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .item-stats {
            font-size: 12px;
            color: #aaa;
        }

        .item-actions {
            display: flex;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top" style="position: relative; display: flex; align-items: center; justify-content: center;">
            <i class="fas fa-chevron-left" onclick="history.back()" style="position: absolute; left: 0; font-size: 18px; color: #333; cursor: pointer;"></i>
            <div class="header-title">刷题版本名称/教材名称</div>
        </div>
        
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div class="province-selector">
                    河南省·语文
                    <i class="fas fa-chevron-down" style="font-size: 10px; color: #ccc;"></i>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; height: 22px;">
                <button class="action-btn-small" onclick="window.location.href='zhangjie_zhengti_baogao.html'" style="display: flex; align-items: center; justify-content: center;">整体报告</button>
                <div class="practice-mode-tag"><i class="fas fa-cog" style="font-size: 12px; margin-right: 4px;"></i>练习模式</div>
            </div>
        </div>
    </div>

    <div class="content-container">
        <div class="special-practice">
            <!-- 单元列表 -->
            <!-- 考点突破 -->
            <div class="practice-unit">
                <div class="unit-header" onclick="toggleUnit(this)">
                    <div class="unit-title">
                        <i class="fas fa-chevron-down" style="font-size: 14px; color: #cccccc;"></i>
                        考点突破 · 基础概念
                    </div>
                </div>
                <div class="unit-progress">24/50 | 正确率: 75%</div>
                <div class="unit-content">
                    <div class="practice-item">
                        <div class="item-info">
                            <div class="item-title">古代文学史概述</div>
                            <div class="item-stats">12/15 | 正确率: 80%</div>
                        </div>
                        <div class="item-actions">
                            <button class="action-btn-small" style="padding: 0 10px;">查看报告</button>
                            <button class="action-btn-small primary" style="padding: 0 10px;">继续答题</button>
                        </div>
                    </div>
                    <div class="practice-item">
                        <div class="item-info">
                            <div class="item-title">现代散文赏析技巧</div>
                            <div class="item-stats">12/35 | 正确率: 70%</div>
                        </div>
                        <div class="item-actions">
                            <button class="action-btn-small" style="padding: 0 10px;">查看解析</button>
                            <button class="action-btn-small primary" style="padding: 0 10px;">继续答题</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 核心考点 -->
            <div class="practice-unit">
                <div class="unit-header" onclick="toggleUnit(this)">
                    <div class="unit-title">
                        <i class="fas fa-chevron-down" style="font-size: 14px; color: #999;"></i>
                        核心考点 · 专项强化
                    </div>
                </div>
                <div class="unit-progress">10/120 | 正确率: 60%</div>
                <div class="unit-content">
                    <div class="practice-item">
                        <div class="item-info">
                            <div class="item-title">诗词鉴赏专项练习</div>
                            <div class="item-stats">10/30 | 正确率: 60%</div>
                        </div>
                        <div class="item-actions">
                            <button class="action-btn-small primary" style="padding: 0 10px;">继续答题</button>
                        </div>
                    </div>
                    <div class="practice-item">
                        <div class="item-info">
                            <div class="item-title">文言文阅读专项</div>
                            <div class="item-stats">0/45 | 正确率: --</div>
                        </div>
                        <div class="item-actions">
                            <button class="action-btn-small primary" style="padding: 0 10px;">开始答题</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 考前提分 -->
            <div class="practice-unit">
                <div class="unit-header" onclick="toggleUnit(this)">
                    <div class="unit-title">
                        <i class="fas fa-chevron-right" style="font-size: 14px; color: #999;"></i>
                        考前提分 · 综合实战
                    </div>
                </div>
                <div class="unit-progress">0/80 | 正确率: --</div>
                <div class="unit-content" style="display: none;">
                    <div class="practice-item">
                        <div class="item-info">
                            <div class="item-title">综合模拟三 (提分版)</div>
                            <div class="item-stats">0/40 | 正确率: --</div>
                        </div>
                        <div class="item-actions">
                            <button class="action-btn-small primary" style="padding: 0 10px;">开始答题</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleUnit(header) {
            const icon = header.querySelector('i');
            const progress = header.nextElementSibling;
            const content = progress.nextElementSibling;
            
            if (icon.classList.contains('fa-chevron-down')) {
                icon.classList.remove('fa-chevron-down');
                icon.classList.add('fa-chevron-right');
                content.style.display = 'none';
            } else {
                icon.classList.remove('fa-chevron-right');
                icon.classList.add('fa-chevron-down');
                content.style.display = 'block';
            }
        }

        const subjectItems = document.querySelectorAll('.subject-item');
        subjectItems.forEach(item => {
            item.addEventListener('click', () => {
                subjectItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
            });
        });
    </script>
</body>
</html>
