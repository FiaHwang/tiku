<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>收藏本</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 重置样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            color: #333;
            background-color: #f5f5f5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            /* PC端适配样式 */
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* 移动端适配 */
        @media screen and (max-width: 768px) {
            html {
                font-size: 14px;
            }
        }

        /* 顶部导航栏 */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 56px;
            padding: 0 16px;
            background-color: #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 100;
        }

        .back-btn {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            font-size: 20px;
            color: #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 101;
            -webkit-tap-highlight-color: transparent;
        }

        .back-btn:active {
            opacity: 0.7;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        .nav-tab {
            padding: 0 16px;
            font-size: 16px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            position: relative;
            height: 56px;
            display: flex;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-tab:active {
            background-color: #f5f5f5;
        }

        .nav-tab.active {
            color: #ff4d4f;
        }

        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 16px;
            right: 16px;
            height: 2px;
            background-color: #ff4d4f;
        }

        /* 错题来源切换 */
        .source-tabs {
            display: flex;
            background-color: #fff;
            border-bottom: 1px solid #e8e8e8;
        }

        .source-tab {
            flex: 1;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        .source-tab:active {
            background-color: #f5f5f5;
        }

        .source-tab.active {
            color: #ff4d4f;
        }

        .source-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            right: 20%;
            height: 2px;
            background-color: #ff4d4f;
        }

        /* 提示信息 */
        .tip {
            padding: 12px 16px;
            font-size: 12px;
            color: #999;
            background-color: #fafafa;
            border-bottom: 1px solid #e8e8e8;
        }

        /* 错题分类容器 */
        .error-category-container {
            padding: 16px;
        }

        /* 错题分类卡片 */
        .error-category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .error-category-card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            padding: 16px;
            position: relative;
            overflow: hidden;
            touch-action: manipulation;
        }

        .error-category-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        .error-category-count {
            font-size: 13px;
            color: #999;
            margin-bottom: 12px;
        }

        .view-btn {
            width: 72px;
            height: 32px;
            background-color: #ff4d4f;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .view-btn:active {
            background-color: #ff7875;
            transform: scale(0.98);
        }

        /* 书本图标背景 */
        .book-icon {
            position: absolute;
            right: 8px;
            bottom: 8px;
            font-size: 52px;
            color: #f5f5f5;
            opacity: 0.8;
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-category-card {
            animation: fadeIn 0.3s ease forwards;
        }

        .error-category-card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .error-category-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .error-category-card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .error-category-card:nth-child(4) {
            animation-delay: 0.4s;
        }

        .error-category-card:nth-child(5) {
            animation-delay: 0.5s;
        }

        /* 响应式设计 */
        @media screen and (max-width: 375px) {
            .header {
                height: 52px;
                padding: 0 14px;
            }

            .back-btn {
                left: 14px;
                width: 36px;
                height: 36px;
                font-size: 18px;
            }

            .nav-tab {
                padding: 0 14px;
                font-size: 15px;
                height: 52px;
            }

            .tip {
                padding: 10px 14px;
                font-size: 11px;
            }

            .error-category-container {
                padding: 14px;
            }

            .error-category-grid {
                gap: 10px;
            }

            .error-category-card {
                padding: 14px;
            }

            .error-category-title {
                font-size: 15px;
            }

            .error-category-count {
                font-size: 12px;
                margin-bottom: 10px;
            }

            .view-btn {
                width: 68px;
                height: 28px;
                font-size: 13px;
            }

            .book-icon {
                font-size: 48px;
                right: 6px;
                bottom: 6px;
            }
        }

        @media screen and (max-width: 320px) {
            .header {
                height: 48px;
                padding: 0 12px;
            }

            .back-btn {
                left: 12px;
                width: 32px;
                height: 32px;
                font-size: 16px;
            }

            .nav-tab {
                padding: 0 12px;
                font-size: 14px;
                height: 48px;
            }

            .tip {
                padding: 8px 12px;
                font-size: 11px;
            }

            .error-category-container {
                padding: 12px;
            }

            .error-category-grid {
                gap: 8px;
            }

            .error-category-card {
                padding: 12px;
            }

            .error-category-title {
                font-size: 14px;
            }

            .error-category-count {
                font-size: 11px;
                margin-bottom: 8px;
            }

            .view-btn {
                width: 60px;
                height: 26px;
                font-size: 12px;
            }

            .book-icon {
                font-size: 40px;
                right: 4px;
                bottom: 4px;
            }
        }

        /* 知识点练习风格的错题列表 */
        .practice-unit {
            background-color: #fff;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border: 1px solid #f0f0f0;
            overflow: hidden;
            animation: fadeIn 0.3s ease forwards;
        }

        .unit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .unit-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .unit-progress {
            font-size: 13px;
            color: #ff4d4f;
            margin-top: 6px;
            padding-left: 24px;
            font-weight: 500;
        }

        .unit-content {
            margin-top: 12px;
            padding-left: 12px;
            border-top: 1px solid #fafafa;
            display: none; /* Default collapsed */
        }

        .practice-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 8px 0;
            border-bottom: 1px solid #f5f5f5;
        }

        .practice-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .item-info {
            flex: 1;
            padding-right: 12px;
        }

        .item-title {
            font-size: 14px;
            font-weight: 500;
            color: #555;
            margin-bottom: 4px;
        }

        .item-stats {
            font-size: 12px;
            color: #999;
        }

        .item-actions {
            display: flex;
            align-items: center;
        }

        .action-btn-small {
            padding: 5px 12px;
            border: 1px solid #ff4d4f;
            border-radius: 4px;
            background-color: #fff;
            font-size: 12px;
            color: #ff4d4f;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.2s;
            font-weight: 500;
        }

        .action-btn-small:active {
            background-color: #fff1f0;
            opacity: 0.9;
        }

        /* 知识点体系切换按钮 */
        .system-tab {
            flex-shrink: 0;
            padding: 6px 14px;
            border: 1px solid #e8e8e8;
            border-radius: 16px;
            font-size: 13px;
            color: #666;
            background-color: #f5f5f5;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .system-tab.active {
            border-color: #ff4d4f;
            color: #fff;
            background-color: #ff4d4f;
        }

        /* 知识点体系切换弹窗样式 */
        .system-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 100%;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.5);
            justify-content: flex-end;
            flex-direction: column;
        }

        .system-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: #f8f8f8;
            border: 1px solid #f0f0f0;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .system-option:active {
            background-color: #f0f0f0;
        }

        .system-option.active {
            background: #fff1f0;
            border-color: #ff4d4f;
            color: #ff4d4f;
        }

        .system-option-check {
            color: #ff4d4f;
            font-size: 14px;
            display: none;
        }

        .system-option.active .system-option-check {
            display: block;
        }
            .header-right-actions { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 12px; }
        .action-icon-btn { border: none; background: transparent; font-size: 18px; color: #333; cursor: pointer; padding: 4px; }
        /* 弹窗样式 */ 
        .settings-modal { display: none; position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: 100%; z-index: 1000; background: rgba(0, 0, 0, 0.5); justify-content: flex-end; flex-direction: column; }
        .settings-modal .modal-body { position: relative; background: #fff; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 12px 20px 24px 20px; box-shadow: 0 -4px 20px rgba(0,0,0,0.15); transform: translateY(100%); transition: transform 0.3s ease-out; display: flex; flex-direction: column; z-index: 1001; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #ff4d4f; }
        input:checked + .slider:before { transform: translateX(20px); }
</style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <button class="back-btn"><i class="fas fa-arrow-left"></i></button>
        <div class="page-title" style="font-size: 17px; font-weight: 600; color: #1a1a1a;">收藏本</div>
    </header>


    <!-- 错题来源切换 -->
    <div class="source-tabs">
        <div class="source-tab active">题型分类</div>
        <div class="source-tab">知识点分类</div>
        
    </div>

    <!-- 提示信息 -->
    <div class="tip">*仅展示所选目标下的数据</div>

    <!-- 错题分类容器 -->
    <div class="error-category-container">
        <!-- 题型分类部分 -->
        <div class="error-category-grid" id="by-type-section">
            <!-- 新一级题型 -->
            <div class="error-category-card">
                <div class="error-category-title">新一级题型</div>
                <div class="error-category-count">共10道</div>
                <button class="view-btn">查看</button>
                <div class="book-icon"><i class="fas fa-book-open"></i></div>
            </div>

            <!-- 单选题 -->
            <div class="error-category-card">
                <div class="error-category-title">单选题</div>
                <div class="error-category-count">共135道</div>
                <button class="view-btn">查看</button>
                <div class="book-icon"><i class="fas fa-book-open"></i></div>
            </div>

            <!-- 多选题 -->
            <div class="error-category-card">
                <div class="error-category-title">多选题</div>
                <div class="error-category-count">共3道</div>
                <button class="view-btn">查看</button>
                <div class="book-icon"><i class="fas fa-book-open"></i></div>
            </div>

            <!-- 填空题 -->
            <div class="error-category-card">
                <div class="error-category-title">填空题</div>
                <div class="error-category-count">共19道</div>
                <button class="view-btn">查看</button>
                <div class="book-icon"><i class="fas fa-book-open"></i></div>
            </div>

            <!-- 判断题 -->
            <div class="error-category-card">
                <div class="error-category-title">判断题</div>
                <div class="error-category-count">共2道</div>
                <button class="view-btn">查看</button>
                <div class="book-icon"><i class="fas fa-book-open"></i></div>
            </div>
        </div>

        <!-- 知识点分类部分 (类似知识点练习中的列表) -->
        <div id="by-knowledge-section" style="display: none;">
            <!-- 折叠式知识点体系选择器 -->
            <div class="knowledge-selector-trigger" onclick="openSystemSelector()" style="display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.02); -webkit-tap-highlight-color: transparent;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <i class="fas fa-layer-group" style="color: #ff4d4f;"></i>
                    <span id="current-system-name" style="font-size: 14px; font-weight: 600; color: #333;">高考人教A版</span>
                </div>
                <div style="color: #999; font-size: 12px;">
                    <i class="fas fa-chevron-down"></i>
                </div>
            </div>
            <!-- 知识点单元列表 -->
            <div id="knowledge-units-list">
                <!-- 动态渲染 -->
            </div>
        </div>
    </div>

    
<!-- 知识点体系选择弹窗 -->
    <div id="system-selector-modal" class="system-modal" style="display: none; position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: 100%; z-index: 1000; background: rgba(0, 0, 0, 0.5); justify-content: flex-end; flex-direction: column;">
        <div class="modal-backdrop" onclick="closeSystemSelector()" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></div>
        <div class="modal-body" style="position: relative; background: #fff; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 12px 20px 24px 20px; box-shadow: 0 -4px 20px rgba(0,0,0,0.15); transform: translateY(100%); transition: transform 0.3s ease-out; display: flex; flex-direction: column; max-height: 75%; z-index: 1001;">
            <!-- 移动端抽屉手柄 -->
            <div style="width: 36px; height: 5px; background: #e0e0e0; border-radius: 3px; margin: 0 auto 16px auto; flex-shrink: 0;"></div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #f0f0f0; flex-shrink: 0;">
                <span style="font-size: 16px; font-weight: 600; color: #333;">选择知识点体系</span>
                <i class="fas fa-times" onclick="closeSystemSelector()" style="color: #999; font-size: 16px; cursor: pointer; padding: 4px;"></i>
            </div>
            <div id="system-list-container" style="display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding-bottom: 20px;">
                <!-- 动态渲染体系列表 -->
            </div>
        </div>
    </div>
    <!-- 设置弹窗 -->
    <div id="settings-modal" class="settings-modal">
        <div class="modal-backdrop" onclick="closeSettingsModal()" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></div>
        <div class="modal-body">
            <div style="width: 36px; height: 5px; background: #e0e0e0; border-radius: 3px; margin: 0 auto 16px auto; flex-shrink: 0;"></div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #f0f0f0;">
                <span style="font-size: 16px; font-weight: 600; color: #333;">设置</span>
                <i class="fas fa-times" onclick="closeSettingsModal()" style="color: #999; font-size: 16px; cursor: pointer; padding: 4px;"></i>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0;">
                <span style="font-size: 15px; color: #333;">答对错题自动移除</span>
                <label class="switch">
                    <input type="checkbox" id="auto-remove-switch">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>
    
    <script>
                // DOM元素获取
        const navTabs = document.querySelectorAll('.nav-tab');
        const backBtn = document.querySelector('.back-btn');
        const sourceTabs = document.querySelectorAll('.source-tab');
        
        // 导航切换功能
        navTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                navTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                if (tab.textContent === '错题本') {
                    window.location.href = 'cuotiben.html';
                } else if (tab.textContent === '练习历史') {
                    window.location.href = 'lianxi_lishi.html';
                }
            });
        });

        // 错题来源切换功能
        sourceTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                sourceTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                const text = tab.textContent.trim();
                
                if (text === '题型分类') {
                    document.getElementById('by-type-section').style.display = 'grid';
                    document.getElementById('by-knowledge-section').style.display = 'none';
                    localStorage.setItem('shoucangben_active_tab', '题型分类');
                } else if (text === '知识点分类') {
                    document.getElementById('by-type-section').style.display = 'none';
                    document.getElementById('by-knowledge-section').style.display = 'block';
                    localStorage.setItem('shoucangben_active_tab', '知识点分类');
                }
            });
        });

        // 返回按钮功能
        backBtn.addEventListener('click', () => {
            window.location.href = 'tiku.html';
        });

// 知识点体系数据 (最多支持展开5层)
        const KNOWLEDGE_SYSTEMS = [
            {
                name: "高考人教A版",
                units: [
                    {
                        name: "第一板块：数与代数",
                        count: 14,
                        items: [
                            {
                                name: "集合与常用逻辑用语",
                                count: 8,
                                items: [
                                    {
                                        name: "集合的含义及其基本关系",
                                        count: 4,
                                        items: [
                                            {
                                                name: "集合的基本概念与表示法",
                                                count: 2,
                                                items: [
                                                    { name: "元素与集合的从属关系", count: 1 },
                                                    { name: "集合的常用表示方法(列举法、描述法)", count: 1 }
                                                ]
                                            },
                                            {
                                                name: "集合之间的包含与相等关系",
                                                count: 2,
                                                items: [
                                                    { name: "子集与真子集的判定", count: 1 },
                                                    { name: "集合相等及参数求解问题", count: 1 }
                                                ]
                                            }
                                        ]
                                    },
                                    {
                                        name: "常用逻辑用语",
                                        count: 4,

        let currentSystemIndex = 0;

        function renderNodeRecursive(node, depth = 0) {
            const hasItems = node.items && node.items.length > 0;

            if (hasItems) {
                return `
                    <div class="practice-unit-node" style="border-bottom: 1px solid #f5f5f5;">
                        <div class="node-header" style="display: flex; justify-content: space-between; align-items: center; padding: 12px; cursor: pointer;" onclick="toggleUnit(this)">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <i class="fas fa-chevron-right" style="color: #999; font-size: 11px; width: 11px; display: inline-block; text-align: center; transition: transform 0.2s;"></i>
                                <div style="display: flex; flex-direction: column; gap: 2px;">
                                    <span style="font-size: 14px; font-weight: 600; color: #333;">${node.name}</span>
                                    <span style="font-size: 12px; color: #999; font-weight: 500;">共 ${node.count} 道</span>
                                </div>
                            </div>
                            <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;" onclick="event.stopPropagation();">
                                <button class="action-btn-small" onclick="viewKnowledgeWrongQuestions('${node.name}', ${node.count})">查看</button>
                            </div>
                        </div>
                        <div class="unit-content" style="display: none; background: #fafafa; border-top: 1px solid #f9f9f9;">
                            ${node.items.map(child => renderNodeRecursive(child, depth + 1)).join('')}
                        </div>
                    </div>
                `;
            } else {
                return `
                    <div class="practice-item" style="display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #f5f5f5;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span style="width: 11px; display: inline-block;"></span>
                            <div style="display: flex; flex-direction: column; gap: 2px;">
                                <div class="item-title" style="margin-bottom: 0; font-size: 13px; font-weight: 500; color: #555;">${node.name}</div>
                                <span style="font-size: 12px; color: #999; font-weight: 500;">共 ${node.count} 道</span>
                            </div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
                            <button class="action-btn-small" onclick="viewKnowledgeWrongQuestions('${node.name}', ${node.count})">查看</button>
                        </div>
                    </div>
                `;
            }
        }

        function renderKnowledgeSystem() {
            const unitsListContainer = document.getElementById('knowledge-units-list');
            if (!unitsListContainer) return;

            // 1. 更新顶部展示的体系名称
            const triggerName = document.getElementById('current-system-name');
            if (triggerName) {
                triggerName.textContent = KNOWLEDGE_SYSTEMS[currentSystemIndex].name;
            }

            // 2. 动态渲染单元列表
            const activeSystem = KNOWLEDGE_SYSTEMS[currentSystemIndex];
            unitsListContainer.innerHTML = activeSystem.units.map(unit => `
                <div class="practice-unit" style="background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; margin-bottom: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.02);">
                    ${renderNodeRecursive(unit, 0)}
                </div>
            `).join('');
        }

        // 弹窗相关逻辑
        function openSystemSelector() {
            const modal = document.getElementById('system-selector-modal');
            const body = modal.querySelector('.modal-body');
            modal.style.display = 'flex';
            
            // 渲染列表
            const container = document.getElementById('system-list-container');
            if (container) {
                container.innerHTML = KNOWLEDGE_SYSTEMS.map((sys, idx) => `
                    <div class="system-option ${idx === currentSystemIndex ? 'active' : ''}" onclick="selectSystem(${idx})">
                        <span>${sys.name}</span>
                        <i class="fas fa-check system-option-check"></i>
                    </div>
                `).join('');
            }

            setTimeout(() => {
                body.style.transform = 'translateY(0)';
            }, 10);
        }

        function closeSystemSelector() {
            const modal = document.getElementById('system-selector-modal');
            const body = modal.querySelector('.modal-body');
            if (!body || !modal) return;
            body.style.transform = 'translateY(100%)';
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }

        function selectSystem(index) {
            currentSystemIndex = index;
            renderKnowledgeSystem();
            closeSystemSelector();
        }

        // 初始化渲染
        renderKnowledgeSystem();

        // 导航切换功能
        navTabs.forEach(tab => {
            // 点击事件
            tab.addEventListener('click', () => {
                // 移除所有标签的active类
                navTabs.forEach(t => t.classList.remove('active'));
                // 为当前点击的标签添加active类
                tab.classList.add('active');
                
                // 这里可以根据标签切换显示不同的内容
                console.log('切换到:', tab.textContent);
                if (tab.textContent === '练习历史') {
                    window.location.href = 'lianxi_lishi.html';
                } else if (tab.textContent === '收藏本') {
                    window.location.href = 'shoucangben.html';
                }
            });

            // 触摸事件（移动端优化）
            tab.addEventListener('touchstart', (e) => {
                // 防止触摸时的默认行为
                e.preventDefault();
                // 触发点击事件
                tab.click();
            }, { passive: false });
        });

        // 错题来源切换功能
        sourceTabs.forEach(tab => {
            // 点击事件
            tab.addEventListener('click', () => {
                // 移除所有标签的active类
                sourceTabs.forEach(t => t.classList.remove('active'));
                // 为当前点击的标签添加active类
                tab.classList.add('active');
                
                const text = tab.textContent.trim();
                console.log('切换到:', text);
                
                if (text === '题型分类') {
                    document.getElementById('by-type-section').style.display = 'grid';
                    document.getElementById('by-knowledge-section').style.display = 'none';
                    localStorage.setItem('cuotiben_active_tab', '题型分类');
                } else if (text === '知识点分类') {
                    document.getElementById('by-type-section').style.display = 'none';
                    document.getElementById('by-knowledge-section').style.display = 'block';
                    localStorage.setItem('cuotiben_active_tab', '知识点分类');
                }
            });

            // 触摸事件（移动端优化）
            tab.addEventListener('touchstart', (e) => {
                // 防止触摸时的默认行为
                e.preventDefault();
                // 触发点击事件
                tab.click();
            }, { passive: false });
        });

        // 查看按钮功能
        document.querySelectorAll('.error-category-card').forEach(card => {
            const btn = card.querySelector('.view-btn');
            if (btn) {
                const title = card.querySelector('.error-category-title').textContent.trim();
                // 点击事件
                btn.addEventListener('click', () => {
                    console.log('查看:', title);
                    // 跳转到错题本试题查看页
                    window.location.href = 'cuotiben_shiti_chakan.html?type=' + encodeURIComponent(title);
                });

                // 触摸事件（移动端优化）
                btn.addEventListener('touchstart', (e) => {
                    // 防止触摸时的默认行为
                    e.preventDefault();
                    // 触发点击事件
                    btn.click();
                }, { passive: false });
            }
        });

        // 展开/收起知识点单元
        function toggleUnit(header) {
            const icon = header.querySelector('.fa-chevron-right') || header.querySelector('.fa-chevron-down');
            const content = header.parentElement.querySelector('.unit-content');
            if (!content) return;

            if (content.style.display === 'none' || content.style.display === '') {
                content.style.display = 'block';
                if (icon) {
                    icon.style.transform = 'rotate(90deg)';
                }
            } else {
                content.style.display = 'none';
                if (icon) {
                    icon.style.transform = 'rotate(0deg)';
                }
            }
        }

        // 查看知识点错题
        function viewKnowledgeWrongQuestions(title, count) {
            if (count === 0) {
                showCustomAlert('该知识点目前没有收藏哦！');
                return;
            }
            console.log('查看知识点错题:', title, count);
            window.location.href = 'cuotiben_shiti_chakan.html?type=' + encodeURIComponent(title);
        }

        
        // 页面加载完成后执行
        window.addEventListener('load', () => {
            // 恢复上次选中的来源标签
            if (sourceTabs && sourceTabs.length > 0) {
                let savedTab = localStorage.getItem('shoucangben_active_tab') || '题型分类';
                const matchedTab = Array.from(sourceTabs).find(t => t.textContent.trim() === savedTab);
                if (matchedTab) {
                    matchedTab.click();
                }
            }
        });
        
</script>

    <script>
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }
    </script>
