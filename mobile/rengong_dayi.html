<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>人工答疑</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 重置样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            color: #333;
            background-color: #f5f5f5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            /* PC端适配样式 */
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* 顶部导航栏 */
        .header {
            display: flex;
            align-items: center;
            height: 56px;
            padding: 0 16px;
            background-color: #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 100;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            font-size: 20px;
            color: #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .back-btn:active {
            opacity: 0.7;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            text-align: center;
            flex: 1;
            margin: 0 10px;
        }

        .header-right {
            display: flex;
            align-items: center;
        }

        .help-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            font-size: 16px;
            color: #666;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        /* 答疑容器 */
        .chat-container {
            padding: 16px;
            min-height: calc(100vh - 230px);
            overflow-y: auto;
        }

        /* 在线时间提示 */
        .online-time {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-bottom: 20px;
            padding: 8px;
            background-color: #f0f0f0;
            border-radius: 12px;
            align-self: center;
        }

        /* 聊天消息 */
        .chat-message {
            display: flex;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease forwards;
        }

        /* 老师消息 */
        .teacher-message {
            justify-content: flex-start;
        }

        /* 用户消息 */
        .user-message {
            justify-content: flex-end;
        }

        /* 消息头像 */
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .user-message .message-avatar {
            margin-right: 0;
            margin-left: 10px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 消息内容 */
        .message-content {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
        }

        /* 老师消息内容 */
        .teacher-message .message-content {
            background-color: #ff4d4f;
            color: #fff;
            border-bottom-left-radius: 4px;
        }

        /* 用户消息内容 */
        .user-message .message-content {
            background-color: #fff;
            color: #333;
            border: 1px solid #e8e8e8;
            border-bottom-right-radius: 4px;
        }

        /* 消息时间 */
        .message-time {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
            margin-left: 46px;
        }

        .user-message .message-time {
            margin-left: 0;
            margin-right: 46px;
            text-align: right;
        }

        /* 图片消息 */
        .image-message {
            margin-bottom: 12px;
        }

        .message-image {
            max-width: 200px;
            border-radius: 8px;
            overflow: hidden;
        }

        .message-image img {
            width: 100%;
            height: auto;
            object-fit: cover;
        }

        /* 语音消息 */
        .voice-message {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .voice-player {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            background-color: #ff4d4f;
            color: #fff;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
        }

        .play-btn {
            width: 24px;
            height: 24px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            margin-right: 12px;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            position: relative;
            margin-right: 12px;
        }

        .progress-fill {
            height: 100%;
            background-color: #fff;
            border-radius: 2px;
            width: 30%;
        }

        .voice-duration {
            font-size: 12px;
            color: #fff;
        }

        /* 解决状态提示 */
        .status-container {
            margin-top: 30px;
            margin-bottom: 20px;
            padding: 16px;
            background-color: #f0f0f0;
            border-radius: 8px;
        }

        .status-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
            text-align: center;
        }

        .status-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .status-btn {
            padding: 8px 20px;
            border: 1px solid #d9d9d9;
            border-radius: 16px;
            background-color: #fff;
            font-size: 14px;
            color: #666;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .status-btn.active {
            background-color: #52c41a;
            color: #fff;
            border-color: #52c41a;
        }

        /* 自动结束提示 */
        .auto-end-tips {
            font-size: 12px;
            color: #999;
            margin-top: 16px;
            line-height: 1.4;
        }

        /* 底部输入区域 */
        .input-container {
            padding: 12px 16px;
            background-color: #fff;
            border-top: 1px solid #e8e8e8;
            position: relative;
            z-index: 99;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background-color: #f5f5f5;
            border-radius: 20px;
            padding: 8px 12px;
        }

        .input-actions {
            display: flex;
            gap: 12px;
            margin-right: 12px;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            font-size: 18px;
            color: #666;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .message-input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 14px;
            color: #333;
            outline: none;
            resize: none;
            min-height: 32px;
            max-height: 100px;
        }

        .send-btn {
            padding: 6px 16px;
            border: none;
            border-radius: 16px;
            background-color: #ff4d4f;
            font-size: 14px;
            color: #fff;
            cursor: pointer;
            margin-left: 12px;
            -webkit-tap-highlight-color: transparent;
        }

        .send-btn:active {
            opacity: 0.8;
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 响应式设计 */
        @media screen and (max-width: 375px) {
            .header {
                height: 52px;
                padding: 0 14px;
            }

            .header-title {
                font-size: 17px;
            }

            .chat-container {
                padding: 14px;
                min-height: calc(100vh - 222px);
            }

            .message-content {
                max-width: 80%;
                padding: 10px 14px;
            }

            .message-image {
                max-width: 180px;
            }

            .input-container {
                padding: 10px 14px;
            }

            .send-btn {
                padding: 5px 14px;
                font-size: 13px;
            }
        }

        @media screen and (max-width: 320px) {
            .header {
                height: 48px;
                padding: 0 12px;
            }

            .header-title {
                font-size: 16px;
            }

            .chat-container {
                padding: 12px;
                min-height: calc(100vh - 214px);
            }

            .message-content {
                max-width: 85%;
                padding: 8px 12px;
            }

            .message-image {
                max-width: 160px;
            }

            .input-container {
                padding: 8px 12px;
            }

            .send-btn {
                padding: 4px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="header-left">
            <button class="back-btn"><i class="fas fa-arrow-left"></i></button>
        </div>
        <div class="header-title">王老师</div>
        <div class="header-right">
            <button class="help-btn" title="帮助"><i class="fas fa-question-circle"></i></button>
        </div>
    </header>

    <!-- 提示信息 -->
    <div style="background-color: #f0f9ff; border-bottom: 1px solid #e6f7ff; padding: 12px 16px;">
        <div style="display: flex; align-items: center; background-color: #e6f7ff; border-radius: 8px; padding: 12px;">
            <div style="background-color: #1890ff; color: #fff; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-right: 12px;">
                <i class="fas fa-question"></i>
            </div>
            <div style="flex: 1;">
                <div style="font-size: 14px; font-weight: 500; color: #333; margin-bottom: 8px;">专升本-河南省-高数</div>
                <div style="font-size: 12px; color: #666; line-height: 1.4;">若想更快得到老师的回复，请务必查看右上角老师答疑时间；建议每次只问一道题哦</div>
            </div>
        </div>
    </div>

    <!-- 答疑容器 -->
    <div class="chat-container">


        <!-- 消息时间 -->
        <div class="message-time">2026-02-11 13:03</div>
        
        <!-- 老师消息 - 图片 -->
        <div class="chat-message teacher-message">
            <div class="message-avatar">
                <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=teacher%20avatar%20portrait&image_size=square" alt="老师头像" class="avatar-img">
            </div>
            <div class="image-message">
                <div class="message-image">
                    <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=scenic%20landscape%20with%20mountains%20and%20lake&image_size=landscape_16_9" alt="解析图片">
                </div>
            </div>
        </div>

        <!-- 消息时间 -->
        <div class="message-time">2026-02-11 13:03</div>
        
        <!-- 老师消息 - 文本 -->
        <div class="chat-message teacher-message">
            <div class="message-avatar">
                <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=teacher%20avatar%20portrait&image_size=square" alt="老师头像" class="avatar-img">
            </div>
            <div class="message-content">
                这个题应该这样理解，你看一下这个图片，上面写的有详细的解析。
            </div>
        </div>

        <!-- 消息时间 -->
        <div class="message-time">2026-02-11 13:03</div>
        
        <!-- 老师消息 - 语音 -->
        <div class="chat-message teacher-message">
            <div class="message-avatar">
                <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=teacher%20avatar%20portrait&image_size=square" alt="老师头像" class="avatar-img">
            </div>
            <div class="voice-message">
                <div class="voice-player">
                    <button class="play-btn"><i class="fas fa-play"></i></button>
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                    <div class="voice-duration">02:10</div>
                </div>
            </div>
        </div>

        <!-- 消息时间 -->
        <div class="message-time">2026-02-11 13:03</div>
        
        <!-- 用户消息 -->
        <div class="chat-message user-message">
            <div class="message-content">
                这个题应该这样理解，你看一下这个图片，上面写的有详细的解析。
            </div>
            <div class="message-avatar">
                <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=student%20avatar%20portrait&image_size=square" alt="用户头像" class="avatar-img">
            </div>
        </div>

        <!-- 消息时间 -->
        <div class="message-time">2026-02-11 12:03</div>
        
        <!-- 用户消息 -->
        <div class="chat-message user-message">
            <div class="message-content">
                好的
            </div>
            <div class="message-avatar">
                <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=student%20avatar%20portrait&image_size=square" alt="用户头像" class="avatar-img">
            </div>
        </div>

        <!-- 解决状态提示 -->
        <div class="status-container">
            <div class="status-title">问题是否解决？</div>
            <div class="status-buttons">
                <button class="status-btn active"><i class="fas fa-check"></i> 已解决</button>
                <button class="status-btn"><i class="fas fa-times"></i> 未解决</button>
            </div>
        </div>
    </div>

    <!-- 底部输入区域 -->
    <div class="input-container">
        <div class="input-wrapper">
            <div class="input-actions">
                <button class="action-btn" title="语音输入"><i class="fas fa-microphone"></i></button>
                <button class="action-btn" title="图片选择"><i class="fas fa-image"></i></button>
            </div>
            <input type="text" class="message-input" placeholder="不懂的知识随时提问哦～">
            <button class="send-btn">发送</button>
        </div>
    </div>

    <script>
        // DOM元素获取
        const backBtn = document.querySelector('.back-btn');
        const messageInput = document.querySelector('.message-input');
        const sendBtn = document.querySelector('.send-btn');
        const chatContainer = document.querySelector('.chat-container');
        const statusBtns = document.querySelectorAll('.status-btn');
        const playBtn = document.querySelector('.play-btn');

        // 返回按钮功能
        backBtn.addEventListener('click', () => {
            console.log('返回');
            // 返回上一页
            window.history.back();
        });

        // 触摸事件（移动端优化）
        backBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            backBtn.click();
        }, { passive: false });

        // 发送按钮功能
        function sendMessage() {
            const message = messageInput.value.trim();
            if (message) {
                // 添加用户消息
                addUserMessage(message);
                // 清空输入框
                messageInput.value = '';
                // 滚动到底部
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        // 添加用户消息
        function addUserMessage(text) {
            // 创建消息时间
            const now = new Date();
            const year = now.getFullYear();
            const month = (now.getMonth() + 1).toString().padStart(2, '0');
            const day = now.getDate().toString().padStart(2, '0');
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const timeString = `${year}-${month}-${day} ${hours}:${minutes}`;

            // 添加时间元素
            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = timeString;
            chatContainer.appendChild(timeDiv);

            // 创建消息元素
            const messageDiv = document.createElement('div');
            messageDiv.className = 'chat-message user-message';
            messageDiv.innerHTML = `
                <div class="message-content">
                    ${text}
                </div>
                <div class="message-avatar">
                    <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=student%20avatar%20portrait&image_size=square" alt="用户头像" class="avatar-img">
                </div>
            `;
            chatContainer.appendChild(messageDiv);
        }

        // 发送按钮点击事件
        sendBtn.addEventListener('click', sendMessage);

        // 输入框回车事件
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // 状态按钮点击事件
        statusBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                statusBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        // 播放按钮点击事件
        playBtn.addEventListener('click', () => {
            const icon = playBtn.querySelector('i');
            if (icon.classList.contains('fa-play')) {
                icon.classList.remove('fa-play');
                icon.classList.add('fa-pause');
                console.log('播放语音');
            } else {
                icon.classList.remove('fa-pause');
                icon.classList.add('fa-play');
                console.log('暂停语音');
            }
        });

        // 触摸事件（移动端优化）
        sendBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            sendBtn.click();
        }, { passive: false });

        statusBtns.forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                btn.click();
            }, { passive: false });
        });

        playBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            playBtn.click();
        }, { passive: false });

        // 页面加载完成后执行
        window.addEventListener('load', () => {
            console.log('页面加载完成');
            // 滚动到底部
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });

        // 触摸事件优化（移动端）
        document.addEventListener('touchstart', function() {}, { passive: true });
        document.addEventListener('touchmove', function() {}, { passive: true });
        document.addEventListener('touchend', function() {}, { passive: true });

        // 禁止双击缩放
        document.addEventListener('dblclick', function(event) {
            event.preventDefault();
        });
    </script>
</body>
</html>
