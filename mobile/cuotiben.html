<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>错题本</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 重置样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            color: #333;
            background-color: #f5f5f5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            /* PC端适配样式 */
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* 移动端适配 */
        @media screen and (max-width: 768px) {
            html {
                font-size: 14px;
            }
        }

        /* 顶部导航栏 */
        .header {
            display: flex;
            align-items: center;
            height: 56px;
            padding: 0 16px;
            background-color: #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 100;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            font-size: 20px;
            color: #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            -webkit-tap-highlight-color: transparent;
        }

        .back-btn:active {
            opacity: 0.7;
        }

        .nav-tabs {
            display: flex;
            flex: 1;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        .nav-tab {
            padding: 0 16px;
            font-size: 16px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            position: relative;
            height: 56px;
            display: flex;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-tab:active {
            background-color: #f5f5f5;
        }

        .nav-tab.active {
            color: #ff4d4f;
        }

        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 16px;
            right: 16px;
            height: 2px;
            background-color: #ff4d4f;
        }

        /* 错题来源切换 */
        .source-tabs {
            display: flex;
            background-color: #fff;
            border-bottom: 1px solid #e8e8e8;
        }

        .source-tab {
            flex: 1;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        .source-tab:active {
            background-color: #f5f5f5;
        }

        .source-tab.active {
            color: #ff4d4f;
        }

        .source-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            right: 20%;
            height: 2px;
            background-color: #ff4d4f;
        }

        /* 提示信息 */
        .tip {
            padding: 12px 16px;
            font-size: 12px;
            color: #999;
            background-color: #fafafa;
            border-bottom: 1px solid #e8e8e8;
        }

        /* 错题分类容器 */
        .error-category-container {
            padding: 16px;
        }

        /* 错题分类卡片 */
        .error-category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .error-category-card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            padding: 16px;
            position: relative;
            overflow: hidden;
            touch-action: manipulation;
        }

        .error-category-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        .error-category-count {
            font-size: 13px;
            color: #999;
            margin-bottom: 12px;
        }

        .view-btn {
            width: 72px;
            height: 32px;
            background-color: #ff4d4f;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .view-btn:active {
            background-color: #ff7875;
            transform: scale(0.98);
        }

        /* 书本图标背景 */
        .book-icon {
            position: absolute;
            right: 8px;
            bottom: 8px;
            font-size: 52px;
            color: #f5f5f5;
            opacity: 0.8;
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-category-card {
            animation: fadeIn 0.3s ease forwards;
        }

        .error-category-card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .error-category-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .error-category-card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .error-category-card:nth-child(4) {
            animation-delay: 0.4s;
        }

        /* 响应式设计 */
        @media screen and (max-width: 375px) {
            .header {
                height: 52px;
                padding: 0 14px;
            }

            .back-btn {
                width: 36px;
                height: 36px;
                font-size: 18px;
            }

            .nav-tab {
                padding: 0 14px;
                font-size: 15px;
                height: 52px;
            }

            .tip {
                padding: 10px 14px;
                font-size: 11px;
            }

            .error-category-container {
                padding: 14px;
            }

            .error-category-grid {
                gap: 10px;
            }

            .error-category-card {
                padding: 14px;
            }

            .error-category-title {
                font-size: 15px;
            }

            .error-category-count {
                font-size: 12px;
                margin-bottom: 10px;
            }

            .view-btn {
                width: 68px;
                height: 28px;
                font-size: 13px;
            }

            .book-icon {
                font-size: 48px;
                right: 6px;
                bottom: 6px;
            }
        }

        @media screen and (max-width: 320px) {
            .header {
                height: 48px;
                padding: 0 12px;
            }

            .back-btn {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }

            .nav-tab {
                padding: 0 12px;
                font-size: 14px;
                height: 48px;
            }

            .tip {
                padding: 8px 12px;
                font-size: 11px;
            }

            .error-category-container {
                padding: 12px;
            }

            .error-category-grid {
                gap: 8px;
            }

            .error-category-card {
                padding: 12px;
            }

            .error-category-title {
                font-size: 14px;
            }

            .error-category-count {
                font-size: 11px;
                margin-bottom: 8px;
            }

            .view-btn {
                width: 60px;
                height: 26px;
                font-size: 12px;
            }

            .book-icon {
                font-size: 40px;
                right: 4px;
                bottom: 4px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <button class="back-btn"><i class="fas fa-arrow-left"></i></button>
        <div class="nav-tabs">
            <div class="nav-tab active">错题本</div>
            <div class="nav-tab" onclick="window.location.href='shoucangben.html'">收藏本</div>
            <div class="nav-tab" onclick="window.location.href='lianxi_lishi.html'">练习历史</div>
        </div>
    </header>

    <!-- 错题来源切换 -->
    <div class="source-tabs">
        <div class="source-tab active">题库错题</div>
        <div class="source-tab">拍错题</div>
    </div>

    <!-- 提示信息 -->
    <div class="tip">*仅展示所选目标下的数据</div>

    <!-- 错题分类容器 -->
    <div class="error-category-container">
        <div class="error-category-grid">
            <!-- 单选题 -->
            <div class="error-category-card">
                <div class="error-category-title">单选题</div>
                <div class="error-category-count">共135道</div>
                <button class="view-btn">查看</button>
                <div class="book-icon"><i class="fas fa-book-open"></i></div>
            </div>

            <!-- 多选题 -->
            <div class="error-category-card">
                <div class="error-category-title">多选题</div>
                <div class="error-category-count">共3道</div>
                <button class="view-btn">查看</button>
                <div class="book-icon"><i class="fas fa-book-open"></i></div>
            </div>

            <!-- 填空题 -->
            <div class="error-category-card">
                <div class="error-category-title">填空题</div>
                <div class="error-category-count">共19道</div>
                <button class="view-btn">查看</button>
                <div class="book-icon"><i class="fas fa-book-open"></i></div>
            </div>

            <!-- 判断题 -->
            <div class="error-category-card">
                <div class="error-category-title">判断题</div>
                <div class="error-category-count">共2道</div>
                <button class="view-btn">查看</button>
                <div class="book-icon"><i class="fas fa-book-open"></i></div>
            </div>
        </div>
    </div>

    <script>
        // DOM元素获取
        const navTabs = document.querySelectorAll('.nav-tab');
        const sourceTabs = document.querySelectorAll('.source-tab');
        const viewBtns = document.querySelectorAll('.view-btn');
        const backBtn = document.querySelector('.back-btn');

        // 导航切换功能
        navTabs.forEach(tab => {
            // 点击事件
            tab.addEventListener('click', () => {
                // 移除所有标签的active类
                navTabs.forEach(t => t.classList.remove('active'));
                // 为当前点击的标签添加active类
                tab.classList.add('active');
                
                // 这里可以根据标签切换显示不同的内容
                console.log('切换到:', tab.textContent);
                if (tab.textContent === '练习历史') {
                    window.location.href = 'lianxi_lishi.html';
                } else if (tab.textContent === '收藏本') {
                    window.location.href = 'shoucangben.html';
                }
            });

            // 触摸事件（移动端优化）
            tab.addEventListener('touchstart', (e) => {
                // 防止触摸时的默认行为
                e.preventDefault();
                // 触发点击事件
                tab.click();
            }, { passive: false });
        });

        // 错题来源切换功能
        sourceTabs.forEach(tab => {
            // 点击事件
            tab.addEventListener('click', () => {
                // 移除所有标签的active类
                sourceTabs.forEach(t => t.classList.remove('active'));
                // 为当前点击的标签添加active类
                tab.classList.add('active');
                
                // 这里可以根据标签切换显示不同的内容
                console.log('切换到:', tab.textContent);
                
                // 根据切换的标签显示不同的内容
            if (tab.textContent === '题库错题') {
                // 显示题库错题内容
                console.log('显示题库错题');
            } else if (tab.textContent === '拍错题') {
                // 跳转到拍错题列表页面
                console.log('跳转到拍错题列表');
                window.location.href = 'paizhao_cuoti_liebiao.html';
            }
            });

            // 触摸事件（移动端优化）
            tab.addEventListener('touchstart', (e) => {
                // 防止触摸时的默认行为
                e.preventDefault();
                // 触发点击事件
                tab.click();
            }, { passive: false });
        });

        // 查看按钮功能
        viewBtns.forEach((btn, index) => {
            // 点击事件
            btn.addEventListener('click', () => {
                const categories = ['单选题', '多选题', '填空题', '判断题'];
                const category = categories[index];
                console.log('查看:', category);
                // 跳转到错题本试题查看页
                window.location.href = 'cuotiben_shiti_chakan.html';
            });

            // 触摸事件（移动端优化）
            btn.addEventListener('touchstart', (e) => {
                // 防止触摸时的默认行为
                e.preventDefault();
                // 触发点击事件
                btn.click();
            }, { passive: false });
        });

        // 返回按钮功能
        backBtn.addEventListener('click', () => {
            console.log('返回');
            // 返回到题库页面
            window.location.href = 'tiku.html';
        });

        // 触摸事件（移动端优化）
        backBtn.addEventListener('touchstart', (e) => {
            // 防止触摸时的默认行为
            e.preventDefault();
            // 触发点击事件
            backBtn.click();
        }, { passive: false });

        // 自定义弹窗函数（替代alert，提升移动端体验）
        function showCustomAlert(message) {
            // 检查是否已存在弹窗
            if (document.querySelector('.custom-alert')) {
                return;
            }

            // 创建弹窗元素
            const alertContainer = document.createElement('div');
            alertContainer.className = 'custom-alert';
            alertContainer.style.position = 'fixed';
            alertContainer.style.top = '50%';
            alertContainer.style.left = '50%';
            alertContainer.style.transform = 'translate(-50%, -50%)';
            alertContainer.style.backgroundColor = 'rgba(0, 0, 0, 0.7)';
            alertContainer.style.color = '#fff';
            alertContainer.style.padding = '20px';
            alertContainer.style.borderRadius = '8px';
            alertContainer.style.fontSize = '16px';
            alertContainer.style.zIndex = '9999';
            alertContainer.style.textAlign = 'center';
            alertContainer.style.minWidth = '200px';
            alertContainer.style.animation = 'fadeIn 0.3s ease';
            alertContainer.textContent = message;

            // 添加到页面
            document.body.appendChild(alertContainer);

            // 2秒后自动关闭
            setTimeout(() => {
                alertContainer.style.animation = 'fadeOut 0.3s ease';
                setTimeout(() => {
                    document.body.removeChild(alertContainer);
                }, 300);
            }, 2000);
        }

        // 添加淡出动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeOut {
                from {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(1);
                }
                to {
                    opacity: 0;
                    transform: translate(-50%, -50%) scale(0.9);
                }
            }
        `;
        document.head.appendChild(style);

        // 页面加载完成后执行
        window.addEventListener('load', () => {
            console.log('页面加载完成');
            // 可以在这里添加页面初始化逻辑
        });

        // 触摸事件优化（移动端）
        document.addEventListener('touchstart', function() {}, { passive: true });
        document.addEventListener('touchmove', function() {}, { passive: true });
        document.addEventListener('touchend', function() {}, { passive: true });

        // 禁止双击缩放
        document.addEventListener('dblclick', function(event) {
            event.preventDefault();
        });

        // 禁止页面滚动时的回弹效果（iOS优化）
        document.body.addEventListener('touchmove', function(event) {
            // 这里可以添加滚动优化逻辑
        }, { passive: true });

        // 优化滚动性能
        if ('scrollBehavior' in document.documentElement.style) {
            // 支持平滑滚动
            console.log('浏览器支持平滑滚动');
        } else {
            // 不支持平滑滚动的浏览器，可以添加polyfill
            console.log('浏览器不支持平滑滚动');
        }
    </script>
</body>
</html>
