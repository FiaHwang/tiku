            <span>中等 (0.5)</span>

        </div>

          }
        }

          galaxyUnmastered: ["非谓语动词", "定语从句", "完形填空语境推断"],

            12,  0, 24, 18,  2, 14,  0, 22,  0, 16,
             0, 31, 10,  0,  6, 25,  0, 18, 11, 40,
            14,  0, 15, 12,  5,  0, 22,  8,  0, 28,
             0, 10, 18,  5,  0, 12, 20,  0,  8, 25,
            11,  3,  0, 16, 14,  0, 10, 22,  0, 12,
             6, 15,  0,  5, 20,  9,  0, 14,  8, 22,
             0, 12, 15,  4,  0, 10, 18,  0,  6, 21,
             9,  2,  0, 14, 11,  0,  8, 19,  0, 10,
             5, 12,  0,  4, 18,  8,  0, 11,  6, 18
          ],
          level2: [
            { name: '句法体系 -> 定语从句与非谓语', rate: 60, color: 'from-amber-400 to-amber-500' },
            { name: '完形填空 -> 语境推断', rate: 68, color: 'from-blue-400 to-indigo-500' },
            { name: '词汇体系 -> 词意辨析', rate: 82, color: 'from-green-400 to-emerald-500' },
            { name: '阅读理解 -> 细节题型', rate: 85, color: 'from-green-400 to-emerald-500' }
          ],
          weakSpots: [
            { name: '句法体系 / 定语从句与非谓语', level: '60%', mistakes: 42, route: 'boruo_tupo.html' },
            { name: '书面表达 / 主谓一致与过渡词', level: '65%', mistakes: 28, route: 'boruo_tupo.html' }
          ],
          aiAdvice: `
            <p>🔍 <strong class="text-amber-950">学情总结：</strong>英语语言整体学习节奏良好，听力理解方面尤为突出（正确率达到 <strong class="text-green-600 font-extrabold">85% 以上</strong>），基础日常词汇多义项词义辨析有较好的积累储备。</p>
            <p>⚠️ <strong class="text-amber-950">核心痛点：</strong>当前主要的拦路难题在高级复合句法结构（限制性定语从句、非谓语动词时态与语态）上，导致长难阅读和完型填空中语义逻辑判断发生偏差，平均正确率仅在 <strong class="text-red-500 font-extrabold">60%</strong> 水平线徘徊。</p>
            <p>🚀 <strong class="text-amber-950">提分攻略：</strong>定语从句与非谓语是您攻坚省市重点线分差的胜负手。每天晚读时可划出5分钟在 <strong class="text-blue-600 font-bold">【AI薄弱突破练】</strong> 进行专属的结构语法强化。结合语法框架卡片并常看您的错题库，必定可轻松点亮定语从句这枚高贵星章！</p>
          `
        }

      let xueqingTrendChartInstance = null;

      function selectSubject(subject) {
        currentXqSubject = 'zh';
        const data = XUEQING_DATA.zh;
        if (!data) return;

        // Populate basic values
        document.getElementById("xq-val-ability-txt").innerText = data.abilityText;
        document.getElementById("xq-ability-pointer").style.left = data.pointerLeft;
        document.getElementById("xq-val-accuracy").innerText = formatRate(data.accuracy);
        document.getElementById("xq-val-percentile").innerText = formatRate(data.percentile);
        document.getElementById("xq-val-7day-count").innerText = data.val7DayCount;
        document.getElementById("xq-val-7day-accuracy").innerText = formatRate(data.val7DayAccuracy);
        document.getElementById("xq-val-mastered-count").innerText = data.masteredCountText;

        // Heatmap Cells
        const heatmapGrid = document.getElementById("heatmap-grid");
        heatmapGrid.innerHTML = "";
        
        const cells360 = [];
        const seedCells = data.heatmapCells && data.heatmapCells.length > 0 ? data.heatmapCells : [12, 18, 0, 24, 30, 8, 15, 5, 0, 35];
        for (let i = 0; i < 360; i++) {
          const seedIndex = i % seedCells.length;
          let volume = seedCells[seedIndex];
          if (volume > 0) {
            // Apply slight organic deviation
            const noise = ((i * 17 + 11) % 15) - 7;
            volume = Math.max(1, volume + noise);
          } else if (((i * 23 + 7) % 100) < 12) {
            volume = ((i * 3) % 10) + i % 3 + 1;
          }
          cells360.push(volume);
        }

        cells360.forEach((volume, idx) => {
          let colorClass = "bg-gray-100";
          if (volume > 40) colorClass = "bg-indigo-700 shadow-inner";
          else if (volume > 20) colorClass = "bg-blue-500";
          else if (volume > 5) colorClass = "bg-blue-200";
          heatmapGrid.innerHTML += `<div class="aspect-square rounded-[1px] ${colorClass} transition-all duration-300 flex items-center justify-center relative group" title="第 ${idx + 1} 天 做题 ${volume} 题"><span class="absolute hidden group-hover:block bg-black text-white text-[9px] px-1.5 py-0.5 rounded -top-7.5 z-10 whitespace-nowrap">第${idx + 1}天: ${volume}题</span></div>`;
        });

        // Reset Weak Spots display count to 10
        currentWeakSpotsToShow = 10;
        renderWeakSpots();

        // AI Advice
        document.getElementById("xq-ai-advice-block").innerHTML = data.aiAdvice;

        // Render / Update Charts
        updateTrendChartOnly();
      }

      function get50WeakSpots(subject) {
        const spots = [];
        let baseTopics = [
          "字音字形辨析", "文言虚词理解", "常常文言实词", "现代文自然段意",
          "现代文中心思想", "古诗词情感倾向", "诗歌炼字意境分析", "成语辨析运用",
          "错别字自检判定", "修辞手法鉴赏", "名著人物性格情节", "名著核心主旨探究",
          "文言特殊句式翻译", "说明文信息提炼", "议论文写作结构", "记叙文细节描写",
          "文言文停顿虚词", "科普文逻辑推断", "标点符号规范使用", "修辞手法关联转换"
        ];

        for (let i = 1; i <= 50; i++) {
          const topic = baseTopics[(i - 1) % baseTopics.length];
          let name = topic;

          const val = (40 + ((i * 13 + 17) % 35) + (i % 5) + ((i * 7) % 10) / 10) / 100;
          const level = val;
          
          spots.push({
            name: name,
            level: level,
            route: 'dati_yemian.html?mode=knowledge&title=' + encodeURIComponent(name)
          });
        }
        return spots;
      }

      function renderWeakSpots() {
        const subject = currentXqSubject;
        const allWeakSpots = get50WeakSpots(subject);
        const weakSpotsContainer = document.getElementById("xq-weak-spots-container");
        if (!weakSpotsContainer) return;
        
        weakSpotsContainer.innerHTML = "";
        
        const visibleSpots = allWeakSpots.slice(0, currentWeakSpotsToShow);
        visibleSpots.forEach(pt => {
          weakSpotsContainer.innerHTML += `
            <div class="flex items-center justify-between p-3 bg-red-50/40 rounded-xl border border-red-100/50 hover:bg-red-50/70 transition-colors">
              <div class="flex flex-col gap-0.5">
                <span class="text-xs font-extrabold text-gray-800">${pt.name}</span>
                <span class="text-[10px] text-red-500 font-medium">正确率: ${formatRate(pt.level * 100)}</span>
              </div>
              <a href="${pt.route}" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white text-[10px] font-extrabold rounded-lg transition-transform text-center shadow-md">
                去薄弱突破
              </a>
            </div>
          `;
        });

        // Update Toggle Button State
        const toggleBtn = document.getElementById("weak-spots-toggle-btn");
        const toggleIcon = document.getElementById("weak-spots-toggle-icon");
        if (toggleBtn) {
          if (currentWeakSpotsToShow >= 50) {
            toggleBtn.querySelector("span").innerText = "收起";
            if (toggleIcon) {
              toggleIcon.className = "fas fa-chevron-up text-[9px] transition-transform";
            }
          } else {
            toggleBtn.querySelector("span").innerText = "展开更多";
            if (toggleIcon) {
              toggleIcon.className = "fas fa-chevron-down text-[9px] transition-transform";
            }
          }
        }
      }

      function toggleWeakSpots() {
        if (currentWeakSpotsToShow >= 50) {
          currentWeakSpotsToShow = 10;
        } else {
          currentWeakSpotsToShow += 10;
        }
        renderWeakSpots();
      }

      function switchTrackPeriod(period) {
        currentXqPeriod = period;
        
        const btnDay = document.getElementById("track-btn-day");
        const btnWeek = document.getElementById("track-btn-week");
        const btnMonth = document.getElementById("track-btn-month");

        btnDay.className = "px-2 py-0.5 rounded text-gray-500";
        btnWeek.className = "px-2 py-0.5 rounded text-gray-500";
        btnMonth.className = "px-2 py-0.5 rounded text-gray-500";

        if (period === 'day') btnDay.className = "px-2 py-0.5 rounded bg-white shadow-sm text-blue-600";
        else if (period === 'week') btnWeek.className = "px-2 py-0.5 rounded bg-white shadow-sm text-blue-600";
        else if (period === 'month') btnMonth.className = "px-2 py-0.5 rounded bg-white shadow-sm text-blue-600";

        updateTrendChartOnly();
      }

      function updateTrendChartOnly() {
        const data = XUEQING_DATA[currentXqSubject];
        if (!data) return;

        const periodData = data.track[currentXqPeriod];

        try {
          if (xueqingTrendChartInstance) {
            xueqingTrendChartInstance.destroy();
          }

          const ctxTrend = document.getElementById("xueqingTrendChart").getContext("2d");
          xueqingTrendChartInstance = new Chart(ctxTrend, {
            type: "line",
            data: {
              labels: periodData.labels,
              datasets: [
                {
                  label: "正确率趋势指数",
                  data: periodData.data,
                  borderColor: "#4f46e5",
                  backgroundColor: "rgba(79, 70, 229, 0.05)",
                  fill: true,
                  tension: 0.35,
                  borderWidth: 3,
                  pointRadius: 4,
                  pointBackgroundColor: "#ffffff",
                  pointBorderWidth: 2.5,
                  pointBorderColor: "#4f46e5",
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false }
              },
              scales: {
                x: {
                  grid: { display: false },
                  ticks: { font: { size: 9 }, color: "#94a3b8" }
                },
                y: {
                  beginAtZero: false,
                  min: 40,
                  max: 100,
                  grid: { color: "#f1f5f9" },
                  ticks: {
                    font: { size: 9 },
                    color: "#94a3b8",
                    callback: (val) => val + "%"
                  }
                }
              }
            }
          });
        } catch (e) {
          console.error("Failed to build trend chart:", e);
        }
      }

      // Initialize on load
      window.addEventListener("DOMContentLoaded", () => {
        selectSubject('zh');
      });
    </script>
  </body>
