        // ------------------ 状态管理 ------------------
        let currentCourseId = 2; // 默认专升本期中联考
        let selectedSubject = "全部";
        let selectedType = "题库"; // 默认展示 题库

        // ------------------ 初始化 ------------------
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const courseParam = parseInt(params.get('course'));
            if (courseParam && coursesData[courseParam]) {
                currentCourseId = courseParam;
            }

            // 加载班级基本信息
            const currentCourse = coursesData[currentCourseId];
            document.getElementById('course-title').innerText = currentCourse.title;
            document.getElementById('learned-progress').innerText = currentCourse.learned;
            document.getElementById('learning-rate').innerText = currentCourse.rate;
            document.getElementById('valid-time').innerText = currentCourse.valid;

            // 动态渲染二级科目tabs
            renderSubjectTabs(currentCourse.subjects);

            // 初始渲染列表
            renderList();
        });

        // ------------------ 渲染科目标签 ------------------
        function renderSubjectTabs(subjects) {
            const container = document.getElementById('subject-tabs-container');
            container.innerHTML = '';

            subjects.forEach((sub, index) => {
                const btn = document.createElement('button');
                btn.className = `subject-tab-btn px-4 py-1.5 rounded-full hover:text-rose-600 transition-all font-medium ${sub === selectedSubject ? 'text-rose-500 font-bold bg-rose-50' : 'text-slate-600'}`;
                btn.innerText = sub;
                btn.onclick = () => selectSubject(sub);
                container.appendChild(btn);

                if (index < subjects.length - 1) {
                    const divider = document.createElement('span');
                    divider.className = 'text-slate-200';
                    divider.innerText = '|';
                    container.appendChild(divider);
                }
            });
        }

        // ------------------ 选择科目 ------------------
        function selectSubject(sub) {
            selectedSubject = sub;
            // 重新高亮二级标签
            const currentCourse = coursesData[currentCourseId];
            renderSubjectTabs(currentCourse.subjects);
            renderList();
        }

        // ------------------ 资料类型过滤 ------------------
        function switchTypeFilter(type) {
            selectedType = type;
            
            // 重新高亮三级分类
            const buttons = document.querySelectorAll('.type-tab-btn');
            buttons.forEach(btn => {
                const bType = btn.getAttribute('data-type');
                if (bType === selectedType) {
                    btn.className = "type-tab-btn pb-2 font-semibold text-rose-500 border-b-2 border-rose-500 relative transition-all";
                } else {
                    btn.className = "type-tab-btn pb-2 font-medium text-slate-500 hover:text-rose-600 relative transition-all";
                }
            });

            renderList();
        }

        // ------------------ 渲染资料列表 ------------------
        function renderList() {
            const listContainer = document.getElementById('items-list-container');
            const noDataState = document.getElementById('no-data-state');
            listContainer.innerHTML = '';

            const currentCourse = coursesData[currentCourseId];
            
            // 过滤列表
            const filteredItems = currentCourse.items.filter(item => {
                const matchSubject = (selectedSubject === "全部" || item.subject === selectedSubject);
                let matchType = (selectedType === "全部" || item.type === selectedType);
                if (selectedType === "题库") {
                    matchType = (item.type === "题库模块" || item.type === "题库单品");
                }
                return matchSubject && matchType;
            });

            if (filteredItems.length === 0) {
                listContainer.classList.add('hidden');
                noDataState.classList.remove('hidden');
                return;
            }

            listContainer.classList.remove('hidden');
            noDataState.classList.add('hidden');

            filteredItems.forEach(item => {
                const card = document.createElement('div');
                card.className = "flex items-center justify-between gap-6 p-5 rounded-xl border border-slate-100 hover:border-rose-100 hover:shadow-md transition-all cursor-pointer bg-white relative";
                
                // 点击卡片跳转逻辑
                card.onclick = () => {
                    if (item.type === "题库单品") {
                        window.location.href = "shuati_mulu_pc.html";
                    } else if (item.link === 'video') {
                        playVideo(currentCourse.title, item.title);
                    } else {
                        window.location.href = item.link;
                    }
                };

                // Thumbnail gradient matching by subject
                let thumbnailGradient = "from-red-400 to-rose-500";
                if (item.subject.includes("英语")) {
                    thumbnailGradient = "from-cyan-400 to-teal-500";
                } else if (item.subject.includes("数学") || item.subject.includes("高等数学")) {
                    thumbnailGradient = "from-blue-400 to-indigo-500";
                } else {
                    thumbnailGradient = "from-amber-400 to-orange-500";
                }

                // 左侧配图占位 (带渐变背景、类型和科目标签)
                const imgBox = document.createElement('div');
                imgBox.className = `w-[110px] h-[75px] rounded-lg flex-shrink-0 relative overflow-hidden bg-gradient-to-br ${thumbnailGradient} p-2 flex flex-col justify-between text-white shadow-sm`;
                imgBox.innerHTML = `
                    <div class="absolute inset-0 opacity-10 bg-[linear-gradient(45deg,rgba(0,0,0,0.1)_25%,transparent_25%,transparent_50%,rgba(0,0,0,0.1)_50%,rgba(0,0,0,0.1)_75%,transparent_75%,transparent)] bg-[length:8px_8px]"></div>
                    <div class="absolute top-1 left-1 bg-black/40 text-[9px] font-bold px-1.5 py-0.5 rounded scale-90 origin-top-left">${item.type}</div>
                    <div class="text-right text-[8px] opacity-80 mt-1">${item.subject}</div>
                    <div class="text-[10px] font-bold truncate mt-auto leading-tight">${item.title.split('-')[1] || item.title}</div>
                `;

                // 中间文字信息
                const infoBox = document.createElement('div');
                infoBox.className = "flex-grow min-w-0";
                
                const title = document.createElement('h3');
                title.className = "font-bold text-slate-800 text-sm mb-1 hover:text-rose-600 transition-colors truncate";
                title.innerText = item.title;

                const subtitle = document.createElement('p');
                subtitle.className = "text-slate-400 text-xs truncate";
                subtitle.innerText = item.desc || "精品资料，伴你备战";

                const validity = document.createElement('div');
                validity.className = "text-[11px] text-slate-400 mt-2";
                validity.innerText = `有效期至：${item.valid || '2026.11.14'}`;

                infoBox.appendChild(title);
                if (item.type !== "题库模块" && item.type !== "题库单品") {
                    infoBox.appendChild(subtitle);
                }
                infoBox.appendChild(validity);

                // 进度条部分 (参照移动端)
                const progressBox = document.createElement('div');
                progressBox.className = "w-[240px] flex-shrink-0 flex flex-col justify-center gap-1.5 px-4 border-l border-r border-slate-100";
                
                const isCompleted = item.progress === 100;
                const progressColor = isCompleted ? 'bg-emerald-500' : 'bg-rose-500';
                const statusTextColor = isCompleted ? 'text-emerald-500' : 'text-slate-500';

                progressBox.innerHTML = `
                    <div class="flex justify-between text-xs font-semibold ${statusTextColor}">
                        <span>${item.progressText || '未开始'}</span>
                        <span class="text-slate-400">${item.ratio || '0/1'}</span>
                    </div>
                    <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div class="${progressColor} h-full rounded-full transition-all duration-300" style="width: ${item.progress || 0}%;"></div>
                    </div>
                `;

                // 右侧操作按钮 / 过期印章
                const actionBox = document.createElement('div');
                actionBox.className = "w-[120px] flex-shrink-0 flex items-center justify-end";
                
                const btn = document.createElement('button');
                btn.className = "bg-rose-600 text-white font-bold px-4 py-2 rounded-lg text-xs hover:bg-rose-700 transition-colors shadow-sm focus:outline-none";
                btn.innerText = item.btnText || "去刷题";
                actionBox.appendChild(btn);

                card.appendChild(imgBox);
                card.appendChild(infoBox);
                card.appendChild(progressBox);
                card.appendChild(actionBox);

                // 右侧 "已过期" 印章
                if (item.isExpired) {
                    const stamp = document.createElement('div');
                    stamp.className = "absolute right-[140px] top-1/2 -translate-y-1/2 stamp opacity-80 scale-75";
                    stamp.innerText = "已过期";
                    card.appendChild(stamp);
                    
                    // 按钮置灰
                    btn.className = "bg-slate-300 text-slate-500 font-bold px-4 py-2 rounded-lg text-xs cursor-not-allowed shadow-sm focus:outline-none";
                    btn.disabled = true;
                }

                listContainer.appendChild(card);
            });
        }

        // ------------------ 全局提示逻辑 (Toast) ------------------
        let toastTimeout;
        function showToast(text) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');
            
            toastText.innerText = text;
            toast.classList.remove('hidden');
            toast.style.opacity = '1';

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        // ------------------ 搜索处理 ------------------
        function handleSearch() {
            const text = document.getElementById('search-input').value.trim();
            if (text === '') {
                showToast('请输入关键词再进行检索哦');
                return;
            }
            showToast(`正在为您检索“${text}”相关资料...`);
        }

        // ------------------ 视频播放逻辑 (保持一致) ------------------
        let isPlaying = false;
        function playVideo(courseName, lectureName) {
            document.getElementById('video-title').innerText = courseName;
            document.getElementById('video-subtitle').innerText = `正在播放：${lectureName}`;
            document.getElementById('video-modal').classList.remove('hidden');
            isPlaying = false;
            updatePlayUI();
        }

        function closeVideo() {
            document.getElementById('video-modal').classList.add('hidden');
            isPlaying = false;
        }

        function togglePlayState() {
            isPlaying = !isPlaying;
            updatePlayUI();
        }

        function updatePlayUI() {
            const playPauseIcon = document.getElementById('play-pause-icon');
            const controlPlayIcon = document.getElementById('control-play-icon');
            const statusText = document.getElementById('lecture-status');
            const progressEl = document.getElementById('video-progress');

            if (isPlaying) {
                playPauseIcon.className = 'fas fa-pause';
                controlPlayIcon.className = 'fas fa-pause';
                statusText.innerText = '正在流式传输高清视频画面...';
                let currentWidth = parseFloat(progressEl.style.width);
                if (currentWidth < 100) {
                    progressEl.style.width = (currentWidth + 12.5) + '%';
                }
            } else {
                playPauseIcon.className = 'fas fa-play';
                controlPlayIcon.className = 'fas fa-play';
                statusText.innerText = '视频已暂停';
            }
        }

        function switchLecture(lectureNum, name) {
            document.querySelectorAll('.lecture-item').forEach(el => {
                el.className = 'lecture-item bg-slate-950/40 border border-slate-800 p-3 rounded-xl flex justify-between items-center text-xs text-slate-300 cursor-pointer hover:bg-slate-800 hover:text-white transition-all';
                const badge = el.querySelector('span:last-child');
                if (badge && badge.innerText === '正在学习') {
                    badge.innerText = '45:00';
                    badge.className = 'text-[10px] text-slate-500 font-normal';
                }
            });

            const activeLecture = event.currentTarget;
            activeLecture.className = 'lecture-item bg-rose-600/10 border border-rose-600/30 p-3 rounded-xl flex justify-between items-center text-xs text-rose-500 font-bold cursor-pointer hover:bg-slate-800 hover:text-white transition-all';
            const badge = activeLecture.querySelector('span:last-child');
            if (badge) {
                badge.innerText = '正在学习';
                badge.className = 'text-[10px] font-semibold bg-rose-600 text-white px-2 py-0.5 rounded-full';
            }

            document.getElementById('video-subtitle').innerText = `正在播放：${name}`;
            isPlaying = true;
            updatePlayUI();
            showToast(`已为您切到第 ${lectureNum} 节：${name}`);
        }

        function seekVideo(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = (clickX / rect.width) * 100;
            document.getElementById('video-progress').style.width = percent + '%';
            showToast('已调整视频播放进度');
        }
    </script>
</body>
</html>
