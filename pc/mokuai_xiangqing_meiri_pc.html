<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日一练 - 库课网校</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 重置样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding-top: 60px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            color: #333;
            background-color: #f5f5f5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 顶部导航栏 */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: 60px;
            background-color: #fff;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo img {
            height: 32px;
            margin-right: 16px;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-item {
            font-size: 14px;
            color: #333;
            text-decoration: none;
            padding: 4px 0;
            position: relative;
        }

        .nav-item:hover {
            color: #ff4d4f;
        }

        .nav-item.active {
            color: #ff4d4f;
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #ff4d4f;
        }

        .search-user {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background-color: #f5f5f5;
            border-radius: 4px;
            padding: 4px 8px;
        }

        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            padding: 4px 8px;
            font-size: 14px;
        }

        .search-btn {
            background-color: #ff4d4f;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 4px 12px;
            cursor: pointer;
        }

        .user-links {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-link {
            color: #333;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .notification {
            position: relative;
        }

        .notification-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background-color: #ff4d4f;
            color: #fff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 主内容区域 */
        .main-container {
            display: flex;
            padding: 24px;
            gap: 24px;
            min-height: calc(100vh - 128px);
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 左侧内容 */
        .left-content {
            flex: 1;
            min-width: 0;
        }

        /* 专项练习区域 */
        .special-practice {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            margin-bottom: 24px;
        }

        .special-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #e8e8e8;
        }

        .special-title {
            font-size: 18px;
            font-weight: 500;
            color: #333;
            display: flex;
            align-items: center;
        }

        .back-btn {
            margin-right: 12px;
            color: #999;
            cursor: pointer;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: #ff4d4f;
        }

        .action-btn {
            padding: 0 16px;
            border-radius: 17px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            min-width: 88px;
        }

        .action-btn.primary {
            background-color: #ff4d4f;
            color: #fff;
            border-color: #ff4d4f;
        }

        .action-btn.secondary {
            background-color: #fff;
            color: #666;
            border-color: #d9d9d9;
        }

        /* 顶部工具栏 */
        .toolbar {
            padding: 16px 20px;
            border-bottom: 1px solid #f8f8f8;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            background-color: #fff;
        }

        /* 练习列表 */
        .practice-list {
            padding: 0 20px;
        }

        .list-header {
            display: grid;
            grid-template-columns: 2fr 100px 100px 200px;
            padding: 12px 0;
            border-bottom: 1px solid #e8e8e8;
            font-size: 13px;
            color: #999;
            font-weight: 500;
        }

        .practice-item {
            display: grid;
            grid-template-columns: 2fr 100px 100px 200px;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid #f5f5f5;
            transition: background-color 0.2s;
        }

        .practice-item:hover {
            background-color: #fafafa;
        }

        .practice-item:last-child {
            border-bottom: none;
        }

        .item-title {
            font-size: 14px;
            color: #333;
            font-weight: 500;
            padding-right: 16px;
        }

        .item-stats {
            font-size: 14px;
            color: #666;
            font-weight: normal;
            text-align: center;
        }

        .item-progress {
            font-size: 14px;
            color: #666;
            text-align: center;
        }

        .item-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            padding-right: 8px;
        }

        /* 右侧边栏 */
        .right-sidebar {
            width: 280px;
            min-width: 280px;
        }

        .sidebar-card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 16px;
            color: #333;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .stat-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #666;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }

        .stat-unit {
            font-size: 12px;
            font-weight: normal;
            color: #999;
            margin-left: 2px;
        }

        .stat-rank {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        /* 页脚 */
        .footer {
            height: 60px;
            background-color: #fff;
            border-top: 1px solid #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #999;
        }

        @media (max-width: 900px) {
            .right-sidebar {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="top-nav">
        <div class="logo" onclick="window.location.href='../index.html'" style="cursor: pointer;">
            <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=red%20background%20with%20white%20chinese%20characters%20%E5%BA%93%E8%AF%BE%20with%20registered%20trademark%20symbol%20simple%20clean%20logo&image_size=square" alt="库课网校">
            <span style="font-weight: bold; color: #333;">库课网校</span>
        </div>
        <div class="nav-menu">
            <a href="tiku_pc.html" class="nav-item">首页</a>
            <a href="#" class="nav-item">课程中心</a>
            <a href="tiku_pc.html" class="nav-item active">题库</a>
            <a href="#" class="nav-item">资讯</a>
            <a href="#" class="nav-item">直播日历</a>
            <a href="#" class="nav-item">各地专升本</a>
        </div>
        <div class="search-user">
            <div class="search-box">
                <input type="text" placeholder="请输入搜索内容">
                <button class="search-btn">搜索</button>
            </div>
            <div class="user-links">
                <a href="xuexi_zhongxin_pc.html" class="user-link">学习中心</a>
                <div class="notification">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge">3</span>
                </div>
                <div class="user-avatar">
                    <i class="fas fa-user" style="font-size: 18px; color: #666;"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- 模块标题 -->
    <div style="background-color: #fff; padding: 16px 0; border-bottom: 1px solid #f0f0f0;">
        <div style="max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; position: relative;">
            <div onclick="window.location.href='tiku_pc.html'" style="cursor: pointer; color: #666; display: flex; align-items: center; transition: color 0.2s;" onmouseover="this.style.color='#ff4d4f'" onmouseout="this.style.color='#666'">
                <i class="fas fa-chevron-left" style="margin-right: 8px;"></i>
                <span style="font-size: 14px;">返回</span>
            </div>
            <div style="position: absolute; left: 40%; transform: translateX(-50%);">
                <span style="font-size: 18px; font-weight: 600; color: #333;">每日一练</span>
            </div>
        </div>
    </div>

    <!-- 主内容区域 -->
    <div class="main-container">
        <div class="left-content">
            <div class="special-practice">
                <div class="toolbar">
                    <div style="display: flex; align-items: center; color: #999; font-size: 12px; background: #f5f5f5; padding: 0 12px; border-radius: 15px; height: 32px; cursor: pointer;">
                        <i class="fas fa-cog" style="margin-right: 4px;"></i> 练习模式
                    </div>
                </div>

                <div class="practice-list">
                    <div class="list-header">
                        <div style="padding-left: 24px;">目录</div>
                        <div style="text-align: center;">正确率</div>
                        <div style="text-align: center;">进度</div>
                        <div style="text-align: right; padding-right: 28px;">操作</div>
                    </div>

                    <!-- 每日一练项 1 -->
                    <div class="practice-item">
                        <div class="item-title">【20260519】每日一练</div>

                        <div class="item-progress">-/-</div>
                        <div class="item-actions">
                            <button class="action-btn primary" onclick="window.location.href='dati_yemian_pc.html'">开始答题</button>
                        </div>
                    </div>

                    <!-- 每日一练项 2 -->
                    <div class="practice-item">
                        <div class="item-title">【20260518】每日一练</div>
                        <div class="item-stats">82.5%</div>
                        <div class="item-progress">10/10</div>
                        <div class="item-actions">
                            <button class="action-btn secondary" onclick="window.location.href='shiti_jiexi_pc.html'">查看解析</button>
                            <button class="action-btn primary" onclick="window.location.href='dati_yemian_pc.html'">再次答题</button>
                        </div>
                    </div>

                    <!-- 每日一练项 3 -->
                    <div class="practice-item">
                        <div class="item-title">【20260517】每日一练</div>
                        <div class="item-stats">--</div>
                        <div class="item-progress">0/10</div>
                        <div class="item-actions">
                            <button class="action-btn primary" onclick="window.location.href='dati_yemian_pc.html'">继续答题</button>
                        </div>
                    </div>

                    <!-- 每日一练项 4 -->
                    <div class="practice-item">
                        <div class="item-title">【20260516】每日一练</div>
                        <div class="item-stats">--</div>
                        <div class="item-progress">--</div>
                        <div class="item-actions">
                            <button class="action-btn primary" onclick="window.location.href='dati_yemian_pc.html'">开始答题</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="right-sidebar">
            <div class="sidebar-card">
                <div class="stat-item">
                    <div class="stat-label">
                        <i class="fas fa-check-circle" style="color: #1890ff;"></i>
                        <span>今日已答</span>
                    </div>
                    <div class="stat-value">64 <span class="stat-unit">道</span></div>
                </div>
                <div class="stat-rank">超过 82% 的学员</div>
                <div style="margin-top: 24px;"></div>
                <div class="stat-item">
                    <div class="stat-label">
                        <i class="fas fa-history" style="color: #fa8c16;"></i>
                        <span>历史共答</span>
                    </div>
                    <div class="stat-value">1660 <span class="stat-unit">道</span></div>
                </div>
                <div class="stat-rank">超过 97% 的学员</div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <div>© 2026 库课网校 版权所有</div>
    </footer>

    <script>

</body>
</html>
