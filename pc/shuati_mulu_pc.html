      .top-nav {

    <script>
      function toggleUnit(header) {
        const icon = header.querySelector("i");
        const content = header.nextElementSibling;
        if (content.style.display === "none") {
          content.style.display = "block";
          icon.className = "fas fa-chevron-down";
        } else {
          content.style.display = "none";
          icon.className = "fas fa-chevron-right";
        }
      }

      // --- PROVINCE SELECTION MODAL LOGIC ---
      let selectedProvince = "河南省";
      let selectedLevel = "大学";
      let selectedSubject = "语文";

      const provincesList = ["河南省", "北京市", "上海市", "山东省", "江苏省", "浙江省", "湖北省", "广东省", "四川省", "陕西省"];
      const levelsList = ["大学", "小学", "中学", "幼儿园"];
      const subjectsList = ["语文", "数学", "英语", "物理", "化学", "生物", "历史", "地理", "政治"];

      function updateProvinceModalTitle() {
          const titleEl = document.getElementById('provinceModalTitle');
          if (titleEl) {
              titleEl.innerText = `${selectedProvince} - ${selectedLevel} - ${selectedSubject}`;
          }
      }

      function renderProvinceModalContents() {
          updateProvinceModalTitle();

          // Render Provinces
          const provContainer = document.getElementById('provincesContainer');
          if (provContainer) {
              provContainer.innerHTML = '';
              provincesList.forEach(p => {
                  const isActive = p === selectedProvince;
                  const chip = document.createElement('div');
                  chip.innerText = p;
                  chip.style.cssText = isActive 
                      ? "padding: 6px 18px; border: 1.5px solid #ff4d4f; border-radius: 20px; font-size: 14px; color: #ff4d4f; background-color: #fff; cursor: pointer; font-weight: 600; transition: all 0.2s;"
                      : "padding: 7px 19px; background-color: #f5f5f5; border-radius: 20px; font-size: 14px; color: #333; cursor: pointer; transition: all 0.2s;";
                  chip.onmouseover = () => { if (!isActive) chip.style.backgroundColor = '#e8e8e8'; };
                  chip.onmouseout = () => { if (!isActive) chip.style.backgroundColor = '#f5f5f5'; };
                  chip.onclick = () => {
                      selectedProvince = p;
                      renderProvinceModalContents();
                  };
                  provContainer.appendChild(chip);
              });
          }

          // Render Levels
          const levelsContainer = document.getElementById('levelsContainer');
          if (levelsContainer) {
              levelsContainer.innerHTML = '';
              levelsList.forEach(l => {
                  const isActive = l === selectedLevel;
                  const chip = document.createElement('div');
                  chip.innerText = l;
                  chip.style.cssText = isActive 
                      ? "padding: 6px 18px; border: 1.5px solid #ff4d4f; border-radius: 20px; font-size: 14px; color: #ff4d4f; background-color: #fff; cursor: pointer; font-weight: 600; transition: all 0.2s;"
                      : "padding: 7px 19px; background-color: #f5f5f5; border-radius: 20px; font-size: 14px; color: #333; cursor: pointer; transition: all 0.2s;";
                  chip.onmouseover = () => { if (!isActive) chip.style.backgroundColor = '#e8e8e8'; };
                  chip.onmouseout = () => { if (!isActive) chip.style.backgroundColor = '#f5f5f5'; };
                  chip.onclick = () => {
                      selectedLevel = l;
                      renderProvinceModalContents();
                  };
                  levelsContainer.appendChild(chip);
              });
          }

          // Render Subjects
          const subContainer = document.getElementById('subjectsContainer');
          if (subContainer) {
              subContainer.innerHTML = '';
              subjectsList.forEach(s => {
                  const isActive = s === selectedSubject;
                  const chip = document.createElement('div');
                  chip.innerText = s;
                  chip.style.cssText = isActive 
                      ? "padding: 6px 18px; border: 1.5px solid #ff4d4f; border-radius: 20px; font-size: 14px; color: #ff4d4f; background-color: #fff; cursor: pointer; font-weight: 600; transition: all 0.2s;"
                      : "padding: 7px 19px; background-color: #f5f5f5; border-radius: 20px; font-size: 14px; color: #333; cursor: pointer; transition: all 0.2s;";
                  chip.onmouseover = () => { if (!isActive) chip.style.backgroundColor = '#e8e8e8'; };
                  chip.onmouseout = () => { if (!isActive) chip.style.backgroundColor = '#f5f5f5'; };
                  chip.onclick = () => {
                      selectedSubject = s;
                      renderProvinceModalContents();
                  };
                  subContainer.appendChild(chip);
              });
          }
      }

      function openProvinceModal() {
          document.getElementById('provinceModal').style.display = 'flex';
          renderProvinceModalContents();
      }

      function closeProvinceModal() {
          document.getElementById('provinceModal').style.display = 'none';
      }

      function confirmProvinceSelection() {
          closeProvinceModal();
          const provinceTextEl = document.getElementById('subnav-province-text');
          if (provinceTextEl) {
              provinceTextEl.innerText = `${selectedProvince}-${selectedSubject}`;
          }
      }

      document.getElementById('provinceModal').addEventListener('click', function(e) {
          if (e.target === this) {
              closeProvinceModal();
          }
      });
    </script>
  </body>
</html>
