            <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                <h3 id="modalTitle" class="font-bold text-slate-800 text-sm">添加试卷类型</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition-colors p-1 rounded-md">
                    <i class="fas fa-times text-xs"></i>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="p-5 space-y-4">
                <input type="hidden" id="editTypeId">
                
                <div>
                    <label class="block text-slate-700 font-medium mb-1 text-xs">
                        试卷类型名称 <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" id="typeNameInput" placeholder="请输入试卷类型名称" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-blue-500 transition-colors">
                </div>

                <div>
                    <label class="block text-slate-700 font-medium mb-1 text-xs">类型说明</label>
                    <textarea id="typeDescInput" rows="3" placeholder="请输入类型说明/用途描述" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-blue-500 transition-colors resize-none"></textarea>
                </div>

                <div class="flex items-center justify-between pt-1">
                    <span class="text-slate-700 font-medium text-xs">是否默认启用</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="typeStatusInput" class="sr-only peer" checked>
                        <div class="w-10 h-5.5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4.5 after:w-4.5 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="px-5 py-3 bg-slate-50 border-t border-slate-100 flex items-center justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-1.5 border border-slate-200 hover:bg-slate-100 text-slate-600 rounded-lg text-xs font-medium transition-colors">取消</button>
                <button onclick="savePaperType()" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium transition-colors shadow-2xs">确定</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 bg-slate-800 text-white text-xs px-4 py-2.5 rounded-lg shadow-lg hidden z-50 flex items-center gap-2 transition-all">
        <i class="fas fa-info-circle text-blue-400" id="toastIcon"></i>
        <span id="toastMsg">提示信息</span>
    </div>

    <script>
        // 初始化试卷类型列表（包含真题试卷等）
        const paperTypes = [
            { id: 1, name: '线下原创题', desc: '7月线下6万原创试题，以试卷上传到未发布。', status: true, isDisabled: false, lockReason: '' },
            { id: 2, name: '线下试卷', desc: '该试卷类型专为线下考试使用，试卷中的新上传的试题会被锁定，锁定期间组卷，客户端各个题库模块会过滤，不会展示这些试题', status: true, isDisabled: true, lockReason: '系统内置类型，不可编辑和删除' },
            { id: 3, name: '真题试卷', desc: '由原来的“历年真题”更名', status: true, isDisabled: true, lockReason: '真题试卷为系统内置类型，不能编辑和删除' },
            { id: 4, name: '模拟试卷', desc: '-', status: true, isDisabled: false, lockReason: '' },
            { id: 5, name: '模考试卷', desc: '-', status: true, isDisabled: false, lockReason: '' },
            { id: 6, name: '阶段测试', desc: '-', status: true, isDisabled: false, lockReason: '' },
            { id: 7, name: '试卷包', desc: '用于试卷包的试卷进行区分', status: true, isDisabled: false, lockReason: '' },
            { id: 8, name: '章节测试', desc: '由原来的“单元测试”更名', status: true, isDisabled: false, lockReason: '' }
        ];

        // 渲染表格
        function renderTable(filterText = '') {
            const tbody = document.getElementById('paperTypeTableBody');
            tbody.innerHTML = '';

            const filtered = paperTypes.filter(item => 
                item.name.toLowerCase().includes(filterText.toLowerCase()) || 
                item.desc.toLowerCase().includes(filterText.toLowerCase())
            );

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center py-12 text-slate-400">
                            <i class="far fa-folder-open text-2xl mb-2 block"></i>
                            未查找到相关的试卷类型
                        </td>
                    </tr>
                `;
                return;
            }

            filtered.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50/70 transition-colors h-12';

                // 判断操作按钮状态 (特别地：真题试卷 和 线下试卷 置灰不能编辑和删除)
                let actionButtonsHtml = '';
                if (item.isDisabled) {
                    actionButtonsHtml = `
                        <span class="text-slate-300 cursor-not-allowed select-none font-normal" title="${item.lockReason || '不能编辑'}">编辑</span>
                        <span class="text-slate-300 cursor-not-allowed select-none font-normal ml-3" title="${item.lockReason || '不能删除'}">删除</span>
                    `;
                } else {
                    actionButtonsHtml = `
                        <button onclick="openEditModal(${item.id})" class="text-blue-600 hover:text-blue-800 hover:underline font-normal cursor-pointer transition-colors">编辑</button>
                        <button onclick="deletePaperType(${item.id})" class="text-blue-600 hover:text-blue-800 hover:underline font-normal cursor-pointer transition-colors ml-3">删除</button>
                    `;
                }

                tr.innerHTML = `
                    <td class="px-3 text-center text-slate-300">
                        <i class="fas fa-ellipsis-v text-[11px] cursor-grab hover:text-slate-400"></i>
                        <i class="fas fa-ellipsis-v text-[11px] cursor-grab hover:text-slate-400 -ml-1"></i>
                    </td>
                    <td class="px-4 py-2.5 font-medium text-slate-800 whitespace-nowrap">${escapeHtml(item.name)}</td>
                    <td class="px-4 py-2.5 text-slate-600 max-w-xl leading-relaxed">${escapeHtml(item.desc)}</td>
                    <td class="px-4 py-2.5 text-center">
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" class="sr-only peer" ${item.status ? 'checked' : ''} onchange="toggleStatus(${item.id})">
                            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600 flex items-center justify-between px-1.5 shadow-2xs">
                                <span class="text-[10px] text-white font-bold peer-checked:block hidden select-none">开</span>
                                <span class="text-[10px] text-slate-400 font-bold peer-checked:hidden block select-none ml-auto">关</span>
                            </div>
                        </label>
                    </td>
                    <td class="px-4 py-2.5 text-right pr-6 whitespace-nowrap">
                        ${actionButtonsHtml}
                    </td>
                `;

                tbody.appendChild(tr);
            });
        }

        // HTML转义工具
        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // 搜索过滤
        function filterPaperTypes() {
            const query = document.getElementById('searchInput').value;
            renderTable(query);
        }

        // 状态切换
        function toggleStatus(id) {
            const item = paperTypes.find(t => t.id === id);
            if (item) {
                item.status = !item.status;
                showToast(`已${item.status ? '开启' : '关闭'}「${item.name}」类型`, 'success');
            }
        }

        // 打开添加弹窗
        function openAddModal() {
            document.getElementById('modalTitle').innerText = '添加试卷类型';
            document.getElementById('editTypeId').value = '';
            document.getElementById('typeNameInput').value = '';
            document.getElementById('typeDescInput').value = '';
            document.getElementById('typeStatusInput').checked = true;

            const modal = document.getElementById('paperTypeModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('typeNameInput').focus();
        }

        // 打开编辑弹窗
        function openEditModal(id) {
            const item = paperTypes.find(t => t.id === id);
            if (!item) return;

            if (item.isDisabled) {
                showToast(item.lockReason || '此试卷类型不能编辑', 'error');
                return;
            }

            document.getElementById('modalTitle').innerText = '编辑试卷类型';
            document.getElementById('editTypeId').value = item.id;
            document.getElementById('typeNameInput').value = item.name;
            document.getElementById('typeDescInput').value = item.desc === '-' ? '' : item.desc;
            document.getElementById('typeStatusInput').checked = item.status;

            const modal = document.getElementById('paperTypeModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        // 关闭弹窗
        function closeModal() {
            const modal = document.getElementById('paperTypeModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // 保存/新增 试卷类型
        function savePaperType() {
            const editId = document.getElementById('editTypeId').value;
            const name = document.getElementById('typeNameInput').value.trim();
            const desc = document.getElementById('typeDescInput').value.trim() || '-';
            const status = document.getElementById('typeStatusInput').checked;

            if (!name) {
                showToast('请输入试卷类型名称', 'error');
                return;
            }

            if (editId) {
                // 编辑模式
                const item = paperTypes.find(t => t.id == editId);
                if (item) {
                    if (item.isDisabled) {
                        showToast('系统内置类型禁止编辑', 'error');
                        return;
                    }
                    item.name = name;
                    item.desc = desc;
                    item.status = status;
                    showToast('编辑试卷类型成功', 'success');
                }
            } else {
                // 新增模式
                const newId = paperTypes.length ? Math.max(...paperTypes.map(t => t.id)) + 1 : 1;
                paperTypes.push({
                    id: newId,
                    name: name,
                    desc: desc,
                    status: status,
                    isDisabled: false,
                    lockReason: ''
                });
                showToast('新增试卷类型成功', 'success');
            }

            closeModal();
            renderTable(document.getElementById('searchInput').value);
        }

        // 删除试卷类型
        function deletePaperType(id) {
            const item = paperTypes.find(t => t.id === id);
            if (!item) return;

            if (item.isDisabled) {
                showToast(item.lockReason || '此试卷类型不能删除', 'error');
                return;
            }

            if (confirm(`确定要删除试卷类型「${item.name}」吗？`)) {
                const idx = paperTypes.findIndex(t => t.id === id);
                if (idx !== -1) {
                    paperTypes.splice(idx, 1);
                    showToast('删除试卷类型成功', 'success');
                    renderTable(document.getElementById('searchInput').value);
                }
            }
        }

        // Toast 提示框
        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;
            if (type === 'success') {
                toastIcon.className = 'fas fa-check-circle text-emerald-400';
            } else if (type === 'error') {
                toastIcon.className = 'fas fa-exclamation-circle text-rose-400';
            } else {
                toastIcon.className = 'fas fa-info-circle text-blue-400';
            }

            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2500);
        }

        // 侧边栏折叠/展开
        function toggleMenu(groupId) {
            const group = document.getElementById(groupId);
            const arrow = document.getElementById('arrow-' + groupId);
            if (group) {
                if (group.classList.contains('hidden')) {
                    group.classList.remove('hidden');
                    if (arrow) arrow.style.transform = 'rotate(0deg)';
                } else {
                    group.classList.add('hidden');
                    if (arrow) arrow.style.transform = 'rotate(180deg)';
                }
            }
        }

        // 页面初始化渲染
        window.addEventListener('DOMContentLoaded', () => {
            renderTable();
        });
    </script>
</body>
</html>
