    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f1f5f9;
            color: #334155;
            overflow: hidden;
            height: 100vh;
        }

        /* Custom scrollbars */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Nav hover and active states */
        .primary-nav-item {
            transition: all 0.15s ease;
        }
        .primary-nav-item:hover {
            color: #2563eb;
            background-color: #f8fafc;
        }
        .primary-nav-item.active {
            color: #2563eb;
            background-color: #eff6ff;
            font-weight: 600;
        }

        .secondary-subitem {
            transition: all 0.15s ease;
        }

        .modal-backdrop {
            background-color: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(2px);
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .animate-scale-in {
            animation: scaleIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>

                </div>

                <!-- 数据表格区域 -->
                <div class="border border-slate-200 rounded-lg overflow-hidden bg-white shadow-2xs">
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-medium">
                                    <th class="py-3 px-3 w-10 text-center">
                                        <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
                                    </th>
                                    <th class="py-3 px-3 font-medium text-slate-700">作业本名称</th>
                                    <th class="py-3 px-3 font-medium text-slate-700">专业分类</th>
                                    <th class="py-3 px-3 font-medium text-slate-700">关联商品/班型/科目</th>
                                    <th class="py-3 px-3 font-medium text-slate-700">关联类型</th>
                                    <th class="py-3 px-3 font-medium text-slate-700">学管师</th>
                                    <th class="py-3 px-3 font-medium text-slate-700">作业数</th>
                                    <th class="py-3 px-3 font-medium text-slate-700">创建时间</th>
                                    <th class="py-3 px-3 font-medium text-slate-700">创建人</th>
                                    <th class="py-3 px-3 font-medium text-slate-700 w-28">操作</th>
                                </tr>
                            </thead>
                            <tbody id="zuoyebenTbody" class="divide-y divide-slate-100 text-slate-700">
                                <!-- 动态内容渲染 -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 底部分页栏 (完美对应截图样式) -->
                <div class="flex items-center justify-end gap-3 text-xs text-slate-500 pt-2 shrink-0">
                    <span id="totalCountText">共 1 条</span>
                    <select class="border border-slate-200 rounded px-2 py-1 text-xs text-slate-600 bg-white focus:outline-none focus:border-blue-500 cursor-pointer">
                        <option value="10">10条/页</option>
                        <option value="20">20条/页</option>
                        <option value="50">50条/页</option>
                    </select>
                    <div class="flex items-center gap-1">
                        <button class="w-6 h-6 border border-slate-200 rounded bg-slate-50 text-slate-300 cursor-not-allowed flex items-center justify-center">
                            <i class="fas fa-chevron-left text-[9px]"></i>
                        </button>
                        <button class="w-6 h-6 border border-blue-500 bg-blue-600 text-white rounded font-medium flex items-center justify-center">
                            1
                        </button>
                        <button class="w-6 h-6 border border-slate-200 rounded bg-slate-50 text-slate-300 cursor-not-allowed flex items-center justify-center">
                            <i class="fas fa-chevron-right text-[9px]"></i>
                        </button>
                    </div>
                    <div class="flex items-center gap-1 text-slate-500 ml-1">
                        <span>前往</span>
                        <input type="text" value="1" class="w-8 border border-slate-200 rounded text-center py-0.5 text-xs focus:outline-none focus:border-blue-500">
                        <span>页</span>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- 新增/编辑作业本 模态框 -->
    <div id="addZuoyebenModal" class="fixed inset-0 z-50 flex items-center justify-center hidden modal-backdrop">
        <div class="bg-white rounded-lg shadow-2xl border border-slate-200 w-full max-w-lg overflow-hidden animate-scale-in">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                <h3 id="modalTitle" class="font-bold text-slate-800 text-sm">新增作业本</h3>
                <button type="button" onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-6 space-y-4 text-xs">
                <div>
                    <label class="block text-slate-700 font-medium mb-1"><span class="text-rose-500 mr-0.5">*</span>作业本名称</label>
                    <input type="text" id="inputName" placeholder="请输入作业本名称" class="w-full border border-slate-200 rounded px-3 py-2 text-slate-700 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-slate-700 font-medium mb-1"><span class="text-rose-500 mr-0.5">*</span>专业分类</label>
                    <select id="inputCategory" class="w-full border border-slate-200 rounded px-3 py-2 text-slate-700 focus:outline-none focus:border-blue-500 bg-white">
                        <option value="专升本" selected>专升本</option>
                        <option value="AI">AI</option>
                        <option value="事业单位">事业单位</option>
                        <option value="大学英语">大学英语</option>
                    </select>
                </div>
                <div>
                    <label class="block text-slate-700 font-medium mb-1"><span class="text-rose-500 mr-0.5">*</span>关联类型</label>
                    <select id="inputRelationType" class="w-full border border-slate-200 rounded px-3 py-2 text-slate-700 focus:outline-none focus:border-blue-500 bg-white">
                        <option value="商品" selected>商品</option>
                        <option value="班型">班型</option>
                        <option value="科目">科目</option>
                    </select>
                </div>
                <div>
                    <label class="block text-slate-700 font-medium mb-1"><span class="text-rose-500 mr-0.5">*</span>关联名称（商品/班型/科目）</label>
                    <input type="text" id="inputRelationTarget" value="招银分校集训专用营商品（1）" placeholder="请输入关联对象名称" class="w-full border border-slate-200 rounded px-3 py-2 text-slate-700 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-slate-700 font-medium mb-1">学管师</label>
                    <input type="text" id="inputTeacher" placeholder="未分配（填 - 代表未分配）" class="w-full border border-slate-200 rounded px-3 py-2 text-slate-700 focus:outline-none focus:border-blue-500">
                </div>
            </div>
            <div class="px-6 py-3 border-t border-slate-100 bg-white flex items-center justify-end gap-2.5">
                <button type="button" onclick="closeAddModal()" class="px-4 py-1.5 border border-slate-200 text-slate-600 hover:bg-slate-50 rounded text-xs">取消</button>
                <button type="button" onclick="submitSaveZuoyeben()" class="px-5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded text-xs font-medium">确 定</button>
            </div>
        </div>
    </div>

    <!-- Toast 提示框 -->
    <div id="toastNotification" class="fixed bottom-6 right-6 z-50 bg-slate-800 text-white text-xs px-4 py-2.5 rounded-lg shadow-xl flex items-center gap-2 transform transition-all duration-300 translate-y-12 opacity-0 pointer-events-none">
        <i id="toastIcon" class="fas fa-circle-check text-emerald-400"></i>
        <span id="toastMessage">操作成功</span>
    </div>

    <script>
        // 模版数据 (完全吻合截图)
        let zuoyebenData = [
            {
                id: 'ZB20260702001',
                name: '作业本',
                category: '专升本',
                target: '招银分校集训专用营商品（1）',
                relationType: '商品',
                teacher: '-',
                homeworkCount: 1,
                createTime: '2026-07-02 17:42:58',
                creator: '郭超强'
            }
        ];

        let editingId = null;

        document.addEventListener('DOMContentLoaded', () => {
            renderTable();
        });

        // 渲染作业本表格
        function renderTable(list = zuoyebenData) {
            const tbody = document.getElementById('zuoyebenTbody');
            document.getElementById('totalCountText').innerText = `共 ${list.length} 条`;

            if (list.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="10" class="py-12 text-center text-slate-400">
                            <i class="far fa-folder-open text-2xl mb-2 text-slate-300 block"></i>
                            <span>暂无符合条件的作业本数据</span>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = list.map((item, index) => `
                <tr class="hover:bg-slate-50/80 transition-colors">
                    <td class="py-3 px-3 text-center">
                        <input type="checkbox" value="${item.id}" class="row-checkbox rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
                    </td>
                    <td class="py-3 px-3 font-medium text-slate-800">${escapeHtml(item.name)}</td>
                    <td class="py-3 px-3 text-slate-600">${escapeHtml(item.category)}</td>
                    <td class="py-3 px-3 text-slate-600">${escapeHtml(item.target)}</td>
                    <td class="py-3 px-3 text-slate-600">${escapeHtml(item.relationType)}</td>
                    <td class="py-3 px-3 text-slate-600">${escapeHtml(item.teacher)}</td>
                    <td class="py-3 px-3 text-slate-600">${item.homeworkCount}</td>
                    <td class="py-3 px-3 text-slate-500">${item.createTime}</td>
                    <td class="py-3 px-3 text-slate-600">${escapeHtml(item.creator)}</td>
                    <td class="py-3 px-3">
                        <div class="flex items-center gap-3">
                            <button type="button" onclick="editZuoyeben(${index})" class="text-blue-600 hover:text-blue-800 hover:underline cursor-pointer font-medium">编辑</button>
                            <a href="zuoye_liebiao.html?zbName=${encodeURIComponent(item.name)}" class="text-blue-600 hover:text-blue-800 hover:underline cursor-pointer font-medium">作业列表</a>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // 侧边栏子菜单折叠/展开
        function toggleSubMenu(menuId) {
            const menuEl = document.getElementById(menuId);
            const arrowEl = document.getElementById('arrow-' + menuId);
            if (!menuEl) return;
            if (menuEl.classList.contains('hidden')) {
                menuEl.classList.remove('hidden');
                if (arrowEl) arrowEl.classList.replace('fa-chevron-down', 'fa-chevron-up');
            } else {
                menuEl.classList.add('hidden');
                if (arrowEl) arrowEl.classList.replace('fa-chevron-up', 'fa-chevron-down');
            }
        }

        // 全选 / 取消全选
        function toggleSelectAll(checkbox) {
            const rowCheckboxes = document.querySelectorAll('.row-checkbox');
            rowCheckboxes.forEach(cb => cb.checked = checkbox.checked);
        }

        // 检索
        function searchZuoyeben() {
            const nameKey = (document.getElementById('filterZuoyebenName').value || '').trim().toLowerCase();
            const relKey = document.getElementById('filterRelationType').value;

            const filtered = zuoyebenData.filter(item => {
                const matchName = !nameKey || item.name.toLowerCase().includes(nameKey);
                const matchRel = !relKey || item.relationType === relKey;
                return matchName && matchRel;
            });

            renderTable(filtered);
            showToast(`已搜索出 ${filtered.length} 条记录`);
        }

        // 重置检索
        function resetSearch() {
            document.getElementById('filterZuoyebenName').value = '';
            document.getElementById('filterRelationType').value = '';
            renderTable(zuoyebenData);
            showToast('已重置查询条件');
        }

        // 打开新增弹窗 (按要求先不弹窗)
        function openAddModal() {
            showToast('新增作业本暂不打开弹窗');
        }

        // 打开编辑弹窗
        function editZuoyeben(index) {
            const item = zuoyebenData[index];
            if (!item) return;
            editingId = item.id;
            document.getElementById('modalTitle').innerText = '编辑作业本';
            document.getElementById('inputName').value = item.name;
            document.getElementById('inputCategory').value = item.category;
            document.getElementById('inputRelationType').value = item.relationType;
            document.getElementById('inputRelationTarget').value = item.target;
            document.getElementById('inputTeacher').value = item.teacher === '-' ? '' : item.teacher;
            document.getElementById('addZuoyebenModal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('addZuoyebenModal').classList.add('hidden');
        }

        // 提交保存作业本
        function submitSaveZuoyeben() {
            const name = (document.getElementById('inputName').value || '').trim();
            const category = document.getElementById('inputCategory').value;
            const relationType = document.getElementById('inputRelationType').value;
            const target = (document.getElementById('inputRelationTarget').value || '').trim();
            const teacher = (document.getElementById('inputTeacher').value || '').trim() || '-';

            if (!name) {
                showToast('请输入作业本名称', 'error');
                return;
            }

            const now = new Date();
            const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

            if (editingId) {
                const targetObj = zuoyebenData.find(x => x.id === editingId);
                if (targetObj) {
                    targetObj.name = name;
                    targetObj.category = category;
                    targetObj.relationType = relationType;
                    targetObj.target = target || '关联明细(1)';
                    targetObj.teacher = teacher;
                }
                showToast(`已成功更新作业本「${name}」`);
            } else {
                const newItem = {
                    id: 'ZB' + Date.now(),
                    name: name,
                    category: category,
                    target: target || '招银分校集训专用营商品（1）',
                    relationType: relationType,
                    teacher: teacher,
                    homeworkCount: 0,
                    createTime: timeStr,
                    creator: '黄飞亚'
                };
                zuoyebenData.unshift(newItem);
                showToast(`已成功创建作业本「${name}」`);
            }

            closeAddModal();
            renderTable();
        }

        // 批量分配学管师
        function batchAssignTeacher() {
            const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
            if (checkedBoxes.length === 0) {
                showToast('请先勾选需要分配学管师的作业本', 'error');
                return;
            }
            const teacherName = prompt('请输入学管师姓名：', '王老师');
            if (teacherName) {
                const selectedIds = Array.from(checkedBoxes).map(cb => cb.value);
                zuoyebenData.forEach(item => {
                    if (selectedIds.includes(item.id)) {
                        item.teacher = teacherName;
                    }
                });
                renderTable();
                showToast(`已批量为 ${selectedIds.length} 项作业本分配学管师「${teacherName}」`);
            }
        }

        // HTML 转义
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // Toast 提示函数
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toastNotification');
            const toastMsg = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = message;
            if (type === 'error') {
                toastIcon.className = 'fas fa-circle-exclamation text-rose-400';
            } else {
                toastIcon.className = 'fas fa-circle-check text-emerald-400';
            }

            toast.classList.remove('translate-y-12', 'opacity-0', 'pointer-events-none');
            
            setTimeout(() => {
                toast.classList.add('translate-y-12', 'opacity-0', 'pointer-events-none');
            }, 2600);
        }
    </script>
</body>
</html>
