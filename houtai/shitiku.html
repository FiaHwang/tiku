<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>库课管理平台 - 试题库</title>
    <!-- FontAwesome & Tailwind CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f1f5f9;
            color: #334155;
            overflow: hidden;
            height: 100vh;
        }

        /* Custom scrollbars */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Nav hover and active states */
        .primary-nav-item {
            transition: all 0.15s ease;
        }
        .primary-nav-item:hover {
            color: #2563eb;
            background-color: #f8fafc;
        }
        .primary-nav-item.active {
            color: #2563eb;
            background-color: #eff6ff;
            font-weight: 600;
        }

        .secondary-subitem {
            transition: all 0.15s ease;
        }
        .secondary-subitem:hover {
            color: #2563eb;
            background-color: #f8fafc;
        }
        .secondary-subitem.active {
            color: #2563eb;
            background-color: #e0edff;
            font-weight: 600;
        }

        .modal-backdrop {
            background-color: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body class="flex flex-col h-screen text-sm select-none">

    <!-- 顶部 Top Header Bar -->
    <header class="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-4 z-20 shrink-0 shadow-xs">
        <!-- Left Section: Logo & Platform Title -->
        <div class="flex items-center gap-3">
            <!-- Red Square Logo Badge -->
            <a href="../index.html" title="返回首页" class="bg-[#e52e2e] text-white rounded px-2 py-1 flex flex-col justify-center items-center shadow-xs hover:opacity-90 transition-opacity">
                <span class="text-sm font-black leading-tight tracking-wider">库课</span>
                <span class="text-[8px] scale-90 font-sans tracking-tighter opacity-90 leading-none">Cook Life</span>
            </a>
            
            <!-- Platform Title -->
            <a href="../index.html" title="返回首页" class="text-lg font-bold text-slate-800 tracking-tight hover:text-blue-600 transition-colors">库课管理平台</a>

            <!-- Big Question Bank Pill Button -->
            <button class="ml-2 px-3 py-1 bg-blue-50 text-blue-600 rounded-full text-xs font-medium flex items-center gap-1.5 hover:bg-blue-100 transition-colors border border-blue-100">
                <span>大题库</span>
                <i class="fas fa-exchange-alt text-[10px]"></i>
            </button>
        </div>

        <!-- Right Section: Search & Utilities & User Profile -->
        <div class="flex items-center gap-4">
            <!-- Search Box -->
            <div class="relative flex items-center">
                <i class="fas fa-search absolute left-3 text-slate-400 text-xs"></i>
                <input type="text" placeholder="请输入功能或试题内容" class="bg-slate-50 border border-slate-200 rounded-lg pl-8 pr-3 py-1.5 text-xs w-64 text-slate-700 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
            </div>

            <!-- Purple AI Cloud Circle Icon -->
            <button class="w-7 h-7 bg-indigo-500 hover:bg-indigo-600 text-white rounded-full flex items-center justify-center shadow-xs transition-transform active:scale-95" title="库AI助手">
                <i class="fas fa-cloud text-xs"></i>
            </button>

            <!-- Utility Action Icons -->
            <div class="flex items-center gap-3 text-slate-500 text-base">
                <button class="hover:text-slate-800 transition-colors" title="文档"><i class="far fa-file-alt"></i></button>
                <button class="hover:text-slate-800 transition-colors" title="待办"><i class="far fa-check-square"></i></button>
                <button class="hover:text-slate-800 transition-colors" title="下发与同步"><i class="fas fa-cloud-upload-alt"></i></button>
                <button class="hover:text-slate-800 transition-colors" title="消息通知"><i class="far fa-comment-dots"></i></button>
                <button class="hover:text-slate-800 transition-colors" title="帮助中心"><i class="far fa-question-circle"></i></button>
                <button class="hover:text-slate-800 transition-colors" title="意见反馈"><i class="far fa-edit"></i></button>
                <button class="hover:text-slate-800 transition-colors" title="应用市场"><i class="fas fa-store"></i></button>
            </div>

            <div class="h-4 w-px bg-slate-200"></div>

            <!-- User Info Dropdown -->
            <div class="flex items-center gap-1.5 cursor-pointer group">
                <span class="text-xs font-medium text-slate-700 group-hover:text-blue-600 transition-colors">黄飞亚</span>
                <i class="fas fa-caret-down text-xs text-slate-400 group-hover:text-blue-600 transition-colors"></i>
            </div>
        </div>
    </header>

    <!-- Header 下方的 Tab 标签栏 -->

            <i class="fas fa-chevron-left text-[10px]"></i>

    <!-- 主体内容区域 (双栏导航 + 试题库内容) -->

            <a href="../index.html" class="primary-nav-item w-12 h-11 rounded-lg flex flex-col items-center justify-center gap-0.5 cursor-pointer text-slate-600">

            </div>
            <div class="primary-nav-item w-12 h-11 rounded-lg flex flex-col items-center justify-center gap-0.5 cursor-pointer text-slate-600">
                <i class="fas fa-users text-base"></i>
                <span class="text-[10px]">CRM</span>
            </div>
            <div class="primary-nav-item w-12 h-11 rounded-lg flex flex-col items-center justify-center gap-0.5 cursor-pointer text-slate-600">

            <div class="primary-nav-item w-12 h-11 rounded-lg flex flex-col items-center justify-center gap-0.5 cursor-pointer text-slate-600">

            <div class="primary-nav-item w-12 h-11 rounded-lg flex flex-col items-center justify-center gap-0.5 cursor-pointer text-slate-600">

                <span class="text-[10px]">商品</span>

            <!-- Active Selected Main Menu: 题库 -->

                <span class="text-[10px]">题库</span>
            </div>

            <div class="primary-nav-item w-12 h-11 rounded-lg flex flex-col items-center justify-center gap-0.5 cursor-pointer text-slate-600">
                <i class="fas fa-newspaper text-base"></i>

            </div>
            <div class="primary-nav-item w-12 h-11 rounded-lg flex flex-col items-center justify-center gap-0.5 cursor-pointer text-slate-600">

            <div class="primary-nav-item w-12 h-11 rounded-lg flex flex-col items-center justify-center gap-0.5 cursor-pointer text-slate-600">

            </div>
            <div class="primary-nav-item w-12 h-11 rounded-lg flex flex-col items-center justify-center gap-0.5 cursor-pointer text-slate-600">
                <i class="fas fa-question-circle text-base"></i>
                <span class="text-[10px]">答疑</span>
            </div>
            <div class="primary-nav-item w-12 h-11 rounded-lg flex flex-col items-center justify-center gap-0.5 cursor-pointer text-slate-600">

            <div class="primary-nav-item w-12 h-11 rounded-lg flex flex-col items-center justify-center gap-0.5 cursor-pointer text-slate-600">

            <div class="primary-nav-item w-12 h-11 rounded-lg flex flex-col items-center justify-center gap-0.5 cursor-pointer text-slate-600">
                <i class="fas fa-yen-sign text-base"></i>
                <span class="text-[10px]">财务</span>
            </div>
            <div class="primary-nav-item w-12 h-11 rounded-lg flex flex-col items-center justify-center gap-0.5 cursor-pointer text-slate-600">
                <i class="fas fa-chart-line text-base"></i>
                <span class="text-[10px]">数据</span>
            </div>
            <div class="primary-nav-item w-12 h-11 rounded-lg flex flex-col items-center justify-center gap-0.5 cursor-pointer text-slate-600">
                <i class="fas fa-headset text-base"></i>
                <span class="text-[10px]">坐席</span>
            </div>
            <div class="primary-nav-item w-12 h-11 rounded-lg flex flex-col items-center justify-center gap-0.5 cursor-pointer text-slate-600">
                <i class="fas fa-mobile-alt text-base"></i>
                <span class="text-[10px]">设备</span>
            </div>

        <!-- 左侧二级子导航 (Secondary Sub-Navigation Sidebar) -->

            <!-- Group 1: 试题管理 -->
            <div class="space-y-1">
                <div class="flex items-center justify-between text-xs text-slate-400 font-medium px-2 py-1 cursor-pointer hover:text-slate-600" onclick="toggleMenu('group-1')">

                <div class="space-y-0.5" id="group-1">

            <!-- Group 2: 试卷管理 -->

                <div class="flex items-center justify-between text-xs text-slate-400 font-medium px-2 py-1 cursor-pointer hover:text-slate-600" onclick="toggleMenu('group-2')">
                    <span>试卷管理</span>
                    <i class="fas fa-chevron-up text-[10px] transition-transform" id="arrow-group-2"></i>
                </div>
                <div class="space-y-0.5" id="group-2">

                </div>
            </div>

            <!-- Group 3: 题库运营 -->
            <div class="space-y-1">
                <div class="flex items-center justify-between text-xs text-slate-400 font-medium px-2 py-1 cursor-pointer hover:text-slate-600" onclick="toggleMenu('group-3')">
                    <span>题库运营</span>
                    <i class="fas fa-chevron-up text-[10px] transition-transform" id="arrow-group-3"></i>
                </div>
                <div class="space-y-0.5" id="group-3">
                    <div class="secondary-subitem px-3 py-1.5 rounded-lg text-xs text-slate-600 cursor-pointer">
                        试卷考试
                    </div>
                    <div class="secondary-subitem px-3 py-1.5 rounded-lg text-xs text-slate-600 cursor-pointer">
                        章节刷题
                    </div>
                    <div class="secondary-subitem px-3 py-1.5 rounded-lg text-xs text-slate-600 cursor-pointer">
                        每日练习
                    </div>
                    <div class="secondary-subitem px-3 py-1.5 rounded-lg text-xs text-slate-600 cursor-pointer">
                        固定刷题
                    </div>
                    <div class="secondary-subitem px-3 py-1.5 rounded-lg text-xs text-slate-600 cursor-pointer">
                        强化通关练
                    </div>
                    <div class="secondary-subitem px-3 py-1.5 rounded-lg text-xs text-slate-600 cursor-pointer">

                    </div>
                    <div class="secondary-subitem px-3 py-1.5 rounded-lg text-xs text-slate-600 cursor-pointer">

                    <div class="secondary-subitem px-3 py-1.5 rounded-lg text-xs text-slate-600 cursor-pointer">

                        学生行为数据看板
                    </a>
                </div>
            </div>

            <!-- Group 4: 资源配置 -->
            <div class="space-y-1">
                <div class="flex items-center justify-between text-xs text-slate-400 font-medium px-2 py-1 cursor-pointer hover:text-slate-600" onclick="toggleMenu('group-4')">
                    <span>资源配置</span>
                    <i class="fas fa-chevron-up text-[10px] transition-transform" id="arrow-group-4"></i>
                </div>
                <div class="space-y-0.5" id="group-4">

        </aside>

        <!-- 右侧主内容区域 Main Content Area -->
        <main class="flex-1 bg-slate-50 overflow-y-auto custom-scrollbar p-4 flex flex-col gap-3">

            <!-- 顶部专业分类与模式选单 Toolbar -->
            <div class="flex items-center justify-between gap-3">
                <!-- 左边：专业分类、科目与体系下拉框 -->
                <div class="flex items-center gap-2">
                    <select id="headerMajorSelect" onchange="handleMajorChange(this)" class="bg-white border border-slate-200 rounded-lg px-3 py-1.5 text-xs text-slate-700 font-medium focus:outline-none focus:border-blue-500 shadow-2xs cursor-pointer min-w-[120px]">
                        <option value="" class="text-slate-400">专业分类</option>
                        <option value="专升本" class="text-slate-700" selected>专升本</option>
                        <option value="高起专" class="text-slate-700">高起专</option>
                        <option value="高起本" class="text-slate-700">高起本</option>
                        <option value="研究生" class="text-slate-700">研究生</option>
                    </select>

                    <select id="headerSubjectSelect" onchange="handleSubjectChange(this)" class="bg-white border border-slate-200 rounded-lg px-3 py-1.5 text-xs text-slate-700 font-medium focus:outline-none focus:border-blue-500 shadow-2xs cursor-pointer min-w-[110px]">
                        <option value="" class="text-slate-400">科目</option>
                        <option value="大学语文" class="text-slate-700" selected>大学语文</option>
                        <option value="植物遗传学" class="text-slate-700">植物遗传学</option>
                        <option value="法学" class="text-slate-700">法学</option>
                        <option value="管理学" class="text-slate-700">管理学</option>
                        <option value="高等数学" class="text-slate-700">高等数学</option>
                    </select>

                    <select id="headerSystemSelect" onchange="handleSystemChange(this)" class="bg-white border border-slate-200 rounded-lg px-3 py-1.5 text-xs text-slate-700 font-medium focus:outline-none focus:border-blue-500 shadow-2xs cursor-pointer min-w-[170px]">
                        <option value="专升本语文知识点体系">专升本语文知识点体系</option>
                    </select>
                </div>

                <!-- 右边：模式组与同步说明 -->
                <div class="flex items-center gap-4">
                    <div class="inline-flex rounded-lg bg-white p-0.5 border border-slate-200 shadow-2xs text-xs">
                        <button id="modeBtnDefault" onclick="switchMode('default')" class="px-3 py-1 rounded-md font-medium text-slate-600 hover:text-slate-900 border border-transparent transition-all">默认模式</button>
                        <button id="modeBtnKnowledge" onclick="switchMode('knowledge')" class="px-3 py-1 rounded-md font-medium text-blue-600 bg-white border border-blue-500 shadow-2xs transition-all">知识点模式</button>
                        <button id="modeBtnChapter" onclick="switchMode('chapter')" class="px-3 py-1 rounded-md font-medium text-slate-600 hover:text-slate-900 border border-transparent transition-all">章节模式</button>
                    </div>

                        <span>试题同步说明</span>

            <!-- 主内容双栏区域 (左侧树形导航 + 右侧试题筛选列表) -->
            <div class="flex-1 flex gap-3 overflow-hidden">

                <!-- 左侧知识点/章节树形导航面板 -->
                <aside id="treeSidebar" class="w-56 bg-white rounded-xl border border-slate-200 p-3 flex flex-col gap-2 shrink-0 shadow-2xs overflow-hidden">
                    <div class="relative shrink-0">
                        <input type="text" id="treeSearchInput" onkeyup="filterTreeNodes()" placeholder="输入关键字进行搜索" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 text-xs text-slate-700 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
                    </div>

                    <div class="flex-1 overflow-y-auto custom-scrollbar text-xs text-slate-700 space-y-1 pt-1" id="treeContainer">
                        <!-- 树形节点 JS 动态渲染 -->
                    </div>
                </aside>

                <!-- 右侧试题主列表内容区域 -->
                <div class="flex-1 flex flex-col gap-3 overflow-y-auto custom-scrollbar pr-0.5">

                    <!-- 已发布 / 未发布 Tab 切换 -->
                    <div class="border-b border-slate-200 flex items-center gap-6 text-xs font-medium">
                        <button onclick="switchQuestionTab('published')" id="tabPublished" class="py-2 text-blue-600 border-b-2 border-blue-600 font-bold transition-colors">
                            已发布
                        </button>
                        <button onclick="switchQuestionTab('unpublished')" id="tabUnpublished" class="py-2 text-slate-500 hover:text-slate-800 transition-colors">
                            未发布
                        </button>
                    </div>

            <!-- 筛选框容器 Filter Card -->
            <div class="bg-white rounded-xl border border-slate-200 p-4 space-y-3 shadow-2xs">
                
                <!-- 第一行：题干 / 试题ID / 创建时间 -->
                <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center">

        function switchMode(mode) {
            currentMode = mode;

            const inactiveClass = 'px-3 py-1 rounded-md font-medium text-slate-600 hover:text-slate-900 border border-transparent transition-all';

            if (btnDefault) btnDefault.className = mode === 'default' ? activeClass : inactiveClass;
            if (btnKnowledge) btnKnowledge.className = mode === 'knowledge' ? activeClass : inactiveClass;
            if (btnChapter) btnChapter.className = mode === 'chapter' ? activeClass : inactiveClass;

            if (mode === 'default') {
                if (treeSidebar) treeSidebar.classList.add('hidden');
                if (systemSelect) systemSelect.classList.add('hidden');
                if (subjectSelect) subjectSelect.value = '';
                if (totalCountEl) totalCountEl.parentNode.innerHTML = '共计 <strong class="text-slate-800 font-bold" id="questionTotalCount">377973</strong> / 482266 题';

                if (treeSidebar) treeSidebar.classList.remove('hidden');

                    systemSelect.classList.remove('hidden');
                    systemSelect.innerHTML = '<option value="专升本语文知识点体系">专升本语文知识点体系</option>';

                    subjectSelect.classList.remove('hidden');

                renderTreeNodes(knowledgeNodes);

                if (treeSidebar) treeSidebar.classList.remove('hidden');
                if (systemSelect) {
                    systemSelect.classList.remove('hidden');
                    systemSelect.innerHTML = '<option value="专升本经济学">专升本经济学</option>';
                }

                    subjectSelect.classList.remove('hidden');

        function renderTreeNodes(nodeList) {
            const container = document.getElementById('treeContainer');
            if (!container) return;
            container.innerHTML = '';

            nodeList.forEach((parent) => {
                const item = document.createElement('div');
                item.className = 'tree-item space-y-0.5';

                let childrenHtml = '';
                parent.children.forEach(child => {
                    childrenHtml += `
                        <div onclick="selectTreeNode(this, '${child}')" class="tree-child-node px-2 py-1.5 rounded-lg hover:bg-slate-100 cursor-pointer text-slate-600 text-xs transition-colors flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-slate-300"></span>
                            <span>${child}</span>
                        </div>
                    `;
                });

                item.innerHTML = `
                    <div onclick="toggleTreeNode(this)" class="tree-parent-node flex items-center justify-between px-2 py-1.5 rounded-lg hover:bg-slate-100 cursor-pointer text-slate-700 font-medium text-xs transition-colors group">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-caret-right text-slate-400 group-hover:text-slate-600 transition-transform text-xs w-3 text-center"></i>
                            <span>${parent.label}</span>
                        </div>
                    </div>
                    <div class="tree-children pl-4 space-y-0.5 hidden">
                        ${childrenHtml}
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function toggleTreeNode(el) {
            const children = el.nextElementSibling;
            const icon = el.querySelector('i');
            if (!children) return;

            if (children.classList.contains('hidden')) {
                children.classList.remove('hidden');
                if (icon) icon.className = 'fas fa-caret-down text-slate-600 transition-transform text-xs w-3 text-center';
            } else {
                children.classList.add('hidden');
                if (icon) icon.className = 'fas fa-caret-right text-slate-400 group-hover:text-slate-600 transition-transform text-xs w-3 text-center';
            }
        }

        function selectTreeNode(el, label) {
            document.querySelectorAll('.tree-child-node, .tree-parent-node').forEach(node => {
                node.classList.remove('bg-blue-50', 'text-blue-600', 'font-medium');
            });
            el.classList.add('bg-blue-50', 'text-blue-600', 'font-medium');
            showToast('已筛选目录：' + label);
        }

        function filterTreeNodes() {
            const keyword = document.getElementById('treeSearchInput').value.trim().toLowerCase();
            const items = document.querySelectorAll('#treeContainer .tree-item');

            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                if (!keyword || text.includes(keyword)) {
                    item.classList.remove('hidden');
                    if (keyword) {
                        const children = item.querySelector('.tree-children');
                        if (children) children.classList.remove('hidden');
                    }
                } else {
                    item.classList.add('hidden');
                }
            });
        }

        function renderQuestions() {
            const container = document.getElementById('questionListContainer');
            container.innerHTML = '';

            const listToRender = currentQuestionList || knowledgeQuestions;

            listToRender.forEach(q => {
                const card = document.createElement('div');
                card.className = 'border border-slate-200 rounded-xl p-3.5 bg-white space-y-2 hover:border-blue-300 transition-colors shadow-2xs text-xs';
                
                const refTagHtml = q.refCount ? `<span class="bg-blue-50 text-blue-600 px-2 py-0.5 rounded text-[11px] font-medium border border-blue-100">引用次数(${q.refCount})</span>` : '';

                card.innerHTML = `
                    <div class="flex items-center justify-between text-slate-500 border-b border-slate-100 pb-2">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" class="question-checkbox rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                            <span class="font-medium text-slate-700">试题ID: ${q.id}</span>
                            <button onclick="copyId('${q.id}')" class="text-slate-400 hover:text-slate-600" title="复制ID">

                            </button>

                            <div class="flex items-center gap-2 text-blue-600">

                                <a href="javascript:void(0)" onclick="addToBasket('${q.id}')" class="hover:underline">加入试题篮</a>
                                <a href="javascript:void(0)" onclick="editQuestion('${q.id}')" class="hover:underline">编辑</a>
                                <a href="javascript:void(0)" onclick="toggleDisable('${q.id}')" class="hover:underline">禁用</a>

                                <a href="javascript:void(0)" onclick="viewLog('${q.id}')" class="hover:underline">日志</a>
                                <a href="javascript:void(0)" onclick="deleteQuestion('${q.id}')" class="text-rose-500 hover:underline">删除</a>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 py-1">
                        <span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-[11px] font-medium">${q.type1} - ${q.type2}</span>
                        <span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-[11px] font-medium">难度: ${q.difficulty}</span>
                        <span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-[11px] font-medium">视频解析: ${q.videoAnalysis}</span>
                        ${refTagHtml}
                    </div>

                    <div class="text-slate-800 leading-relaxed font-normal pt-1">
                        ${q.stem}
                    </div>
                `;
                container.appendChild(card);
            });
        }

            } else {
                el.classList.add('hidden');
                if (arrow) arrow.style.transform = 'rotate(180deg)';

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = msg;
            if (isError) {
                toastIcon.className = 'fas fa-exclamation-circle text-rose-400 text-sm';
            } else {
                toastIcon.className = 'fas fa-check-circle text-emerald-400 text-sm';
            }

            toast.classList.remove('translate-y-12', 'opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('translate-y-12', 'opacity-0', 'pointer-events-none');
            }, 2500);
        }

        function copyId(id) {
            navigator.clipboard.writeText(id).then(() => {
                showToast('已复制试题ID: ' + id);

                showToast('已复制试题ID: ' + id);
            });

            const val = selectEl.value;

            if (!val) {
                selectEl.className = "bg-white border border-slate-200 rounded-lg px-3 py-1.5 text-xs text-slate-500 font-medium focus:outline-none focus:border-blue-500 shadow-2xs cursor-pointer min-w-[120px]";

                return;
            }

            selectEl.className = "bg-white border border-slate-200 rounded-lg px-3 py-1.5 text-xs text-slate-800 font-medium focus:outline-none focus:border-blue-500 shadow-2xs cursor-pointer min-w-[120px]";

            if (subjectSelect) {
                const subjects = subjectMap[val] || ['专业科目'];

                    optionsHtml += `<option value="${sub}" class="text-slate-700">${sub}</option>`;

            document.getElementById('filterStem').value = '';

            document.getElementById('filterStructure').selectedIndex = 0;
            document.getElementById('filterTypeLevel1').selectedIndex = 0;
            document.getElementById('filterTypeLevel2').selectedIndex = 0;
            
            const majorSelect = document.getElementById('headerMajorSelect');
            if (majorSelect) {
                majorSelect.value = '';
                handleMajorChange(majorSelect);
            }
            showToast('重置筛选条件');
        }

        document.addEventListener('click', function(e) {
            const batchMenu = document.getElementById('batchMenu');
            if (batchMenu && !batchMenu.contains(e.target) && !e.target.closest('button[onclick="toggleBatchMenu()"]')) {
                batchMenu.classList.add('hidden');
            }
        });

        // Initialize Page
        switchMode('default');
        renderQuestions();
